<!DOCTYPE html>
<html>
<head>
  <title>Mzansi Marketplace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #f7f7f7;
      --card: white;
      --text: black;
      --primary: #000;
    }

    .dark {
      --bg: #121212;
      --card: #1e1e1e;
      --text: white;
      --primary: #fff;
    }

    body {
      margin:0;
      font-family: -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .header {
      display:flex;
      justify-content:space-between;
      padding:15px;
      background: var(--card);
      border-bottom:1px solid #ddd;
    }

    .search {
      padding:15px;
      background: var(--card);
    }

    .search input {
      width:100%;
      padding:12px;
      border-radius:25px;
      border:none;
      background:#eee;
    }

    .card {
      background: var(--card);
      margin:12px;
      border-radius:15px;
      overflow:hidden;
    }

    .card img {
      width:100%;
      height:160px;
      object-fit:cover;
    }

    .card-content {
      padding:10px;
    }

    .btn {
      padding:10px;
      border:none;
      border-radius:8px;
      margin-top:5px;
    }

    .chat-btn { background:black; color:white; }
    .wa-btn { background:#25D366; color:white; }

    .nav {
      position:fixed;
      bottom:0;
      width:100%;
      display:flex;
      justify-content:space-around;
      background:var(--card);
      padding:10px;
    }

  </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <b>Mzansi</b>
  <div>
    <span id="credits">0</span>
    <button onclick="toggleTheme()">🌙</button>
  </div>
</div>

<div class="search">
  <input id="search" placeholder="Search..." oninput="loadAds()">
</div>

<!-- HOME -->
<div id="homeSection">
  <div id="ads"></div>
</div>

<!-- POST -->
<div id="postSection" style="display:none; padding:15px;">
  <input id="title" placeholder="Title">
  <input id="price" placeholder="Price">
  <input id="whatsapp" placeholder="WhatsApp">
  <input id="location" placeholder="Location">

  <select id="category">
    <option>Plumbing</option>
    <option>Cleaning</option>
  </select>

  <label><input type="checkbox" id="featured"> Featured (3 credits)</label>

  <button onclick="saveAd()">Post</button>
</div>

<!-- INBOX -->
<div id="inbox" style="display:none; padding:15px;">
  <h2>Messages</h2>
  <div id="chatList"></div>
</div>

<!-- PROFILE -->
<div id="profileSection" style="display:none; padding:15px;">
  <h2>Profile</h2>
  <button onclick="shareReferral()">Invite Friends</button>
  <button onclick="logout()">Logout</button>
</div>

<!-- CHAT -->
<div id="chatBox" style="
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:#ece5dd;
  display:none;
  flex-direction:column;
">

  <div style="background:#000;color:white;padding:10px;">
    <button onclick="closeChat()">⬅</button>
    Chat
  </div>

  <div id="messages" style="flex:1;overflow:auto;padding:10px;"></div>

  <div style="display:flex;background:white;">
    <input id="msgInput" style="flex:1;padding:10px">
    <button onclick="sendMessage()">➡️</button>
  </div>
</div>

<!-- LOGIN -->
<div id="loginDiv" style="padding:15px;">
  <input id="email">
  <input id="password" type="password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="showHome()">🏠</button>
  <button onclick="showPost()">➕</button>
  <button onclick="showInbox()">💬</button>
  <button onclick="showProfile()">👤</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  doc, setDoc, getDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentUser;
let userCredits = 0;
let chatUser = "";

// DARK MODE
window.toggleTheme = () => {
  document.body.classList.toggle("dark");
};

// AUTH
onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  currentUser = user;

  const snap = await getDoc(doc(db, "users", user.uid));
  userCredits = snap.data().credits;

  credits.innerText = userCredits;

  loginDiv.style.display = "none";

  loadAds();
});

// LOGIN
window.signup = async () => {
  const user = await createUserWithEmailAndPassword(auth, email.value, password.value);
  await setDoc(doc(db, "users", user.user.uid), {
    credits: 10
  });
};

window.login = async () => {
  await signInWithEmailAndPassword(auth, email.value, password.value);
};

window.logout = () => signOut(auth);

// POST AD
window.saveAd = async () => {

  let cost = featured.checked ? 3 : 1;
  if (userCredits < cost) return alert("No credits");

  await addDoc(collection(db, "ads"), {
    title: title.value,
    price: price.value,
    whatsapp: whatsapp.value,
    location: location.value,
    featured: featured.checked,
    userId: currentUser.uid
  });

  userCredits -= cost;

  await updateDoc(doc(db, "users", currentUser.uid), {
    credits: userCredits
  });

  credits.innerText = userCredits;

  loadAds();
};

// LOAD ADS
async function loadAds() {

  ads.innerHTML = "";

  const snap = await getDocs(collection(db, "ads"));

  snap.forEach(doc => {

    let ad = doc.data();

    ads.innerHTML += `
      <div class="card">
        <div class="card-content">
          <h3>${ad.featured ? "⭐" : ""} ${ad.title}</h3>
          <p>${ad.price}</p>

          <button class="btn chat-btn" onclick="openChat('${ad.userId}')">Chat</button>

          <button class="btn wa-btn"
            onclick="window.open('https://wa.me/${ad.whatsapp}')">
            WhatsApp
          </button>

          <button onclick="shareAd('${ad.title}')">Share</button>
        </div>
      </div>
    `;
  });
}

// CHAT
window.openChat = (uid) => {
  chatUser = uid;
  chatBox.style.display = "flex";
  loadMessages();
};

window.closeChat = () => chatBox.style.display = "none";

window.sendMessage = async () => {

  let chatId = [currentUser.uid, chatUser].sort().join("_");

  await addDoc(collection(db, "chats", chatId, "messages"), {
    text: msgInput.value,
    sender: currentUser.uid
  });

  msgInput.value = "";
};

// MESSAGES
async function loadMessages() {

  messages.innerHTML = "";

  const snap = await getDocs(collection(db, "chats", [currentUser.uid, chatUser].sort().join("_"), "messages"));

  snap.forEach(doc => {

    let m = doc.data();

    messages.innerHTML += `
      <div style="display:flex;justify-content:${m.sender === currentUser.uid ? 'flex-end':'flex-start'};">
        <div style="
          background:${m.sender === currentUser.uid ? '#000':'#ddd'};
          color:${m.sender === currentUser.uid ? 'white':'black'};
          padding:10px;
          border-radius:15px;
          margin:5px;
        ">
          ${m.text}
        </div>
      </div>
    `;
  });
}

// NAVIGATION
function hideAll(){
  homeSection.style.display="none";
  postSection.style.display="none";
  inbox.style.display="none";
  profileSection.style.display="none";
}

window.showHome = () => { hideAll(); homeSection.style.display="block"; };
window.showPost = () => { hideAll(); postSection.style.display="block"; };
window.showInbox = () => { hideAll(); inbox.style.display="block"; };
window.showProfile = () => { hideAll(); profileSection.style.display="block"; };

// SHARE
window.shareAd = (title) => {
  window.open(`https://wa.me/?text=${encodeURIComponent(title)}`);
};

window.shareReferral = () => {
  window.open(`https://wa.me/?text=Join Mzansi using my code ${currentUser.uid}`);
};

</script>

</body>
</html>
