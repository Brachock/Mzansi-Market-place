<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mzansi Marketplace</title>

<style>
body {font-family:Arial;margin:0;background:#f5f5f5}
header {
  background:#007bff;color:white;padding:15px;
  display:flex;justify-content:space-between
}
.container {padding:15px;max-width:900px;margin:auto}

.card {
  background:white;padding:15px;margin-bottom:15px;
  border-radius:10px
}

input,select,textarea {
  width:100%;padding:10px;margin:5px 0;
  border-radius:6px;border:1px solid #ddd
}

button {
  background:#007bff;color:white;
  border:none;padding:10px;border-radius:6px
}

.product {
  display:flex;gap:10px;
  border-bottom:1px solid #ddd;padding:10px
}
.product img {
  width:80px;height:80px;border-radius:6px
}

.featured {border:2px solid gold}

.categories {
 display:flex;gap:5px;overflow-x:auto;margin:10px 0
}

.categories button {
  padding:6px 10px;border:1px solid #ddd;background:white
}

.categories .active {background:#007bff;color:white}

.credit-box {
  padding:10px;background:white;margin-bottom:10px;border-radius:10px
}

.bar {
  height:6px;background:#eee;margin-top:5px;border-radius:5px
}
.bar-fill {
  height:6px;background:#007bff;border-radius:5px
}
</style>
</head>

<body>

<header>
<b>Mzansi Market</b>
<button onclick="toggleDark()">🌙</button>
</header>

<div class="container">

<!-- LOGIN -->
<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<div id="creditBox" class="credit-box"></div>

<div class="card">
<input id="search" placeholder="Search..." oninput="render()">

<div class="categories" id="catBox"></div>
</div>

<div class="card">
<h3>Post</h3>

<input id="title" placeholder="Title">
<input id="price" placeholder="Price">
<input id="whatsapp" placeholder="071...">

<select id="category"></select>

<input type="file" id="img">

<label><input type="checkbox" id="featured"> Featured (3 credits)</label>

<button onclick="postAd()">Post</button>
</div>

<div class="card">
<div id="products"></div>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,doc,setDoc,getDoc,updateDoc,
collection,addDoc,getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ✅ YOUR FIREBASE CONFIG */
const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_ID",
storageBucket:"YOUR_BUCKET"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

/* ✅ VARIABLES */
let currentUser;
let userCredits = 0;
let allAds = [];
let currentCategory = "All";

const CATEGORIES = ["Vehicles","Property","Jobs","Electronics","Services"];

/* ✅ REGISTER */
window.register = async ()=>{
let u = await createUserWithEmailAndPassword(auth,email.value,password.value);

await setDoc(doc(db,"users",u.user.uid),{
credits:10
});

alert("✅ 10 credits given!");
};

/* ✅ LOGIN */
window.login = async ()=>{
await signInWithEmailAndPassword(auth,email.value,password.value);
};

/* ✅ AUTH */
onAuthStateChanged(auth, async user=>{

if(!user) return;

currentUser = user;

auth.style.display="none";
app.style.display="block";

/* GET CREDITS */
let snap = await getDoc(doc(db,"users",user.uid));
userCredits = snap.data().credits;

updateCredit();

/* LOAD */
loadCategories();
loadAds();

});

/* ✅ CREDIT UI */
function updateCredit(){
creditBox.innerHTML=`
Credits: ${userCredits}
<div class="bar">
<div class="bar-fill" style="width:${(userCredits/10)*100}%"></div>
</div>
`;
}

/* ✅ CATEGORIES */
function loadCategories(){

catBox.innerHTML=`<button class="active" onclick="setCat('All',this)">All</button>`;

category.innerHTML="";

CATEGORIES.forEach(cat=>{
catBox.innerHTML += `<button onclick="setCat('${cat}',this)">${cat}</button>`;
category.innerHTML += `<option>${cat}</option>`;
});

}

window.setCat = (cat,btn)=>{
currentCategory = cat;

document.querySelectorAll(".categories button").forEach(b=>{
b.classList.remove("active");
});
btn.classList.add("active");

render();
};

/* ✅ POST AD */
window.postAd = async ()=>{

let cost = featured.checked ? 3 : 1;

if(userCredits < cost){
alert("No credits!");
return;
}

let imgUrl="https://via.placeholder.com/100";

if(img.files[0]){
let r = ref(storage,"ads/"+Date.now());
let s = await uploadBytes(r,img.files[0]);
imgUrl = await getDownloadURL(s.ref);
}

await addDoc(collection(db,"ads"),{
title:title.value,
price:price.value,
category:category.value,
whatsapp:whatsapp.value,
image:imgUrl,
featured:featured.checked,
uid:currentUser.uid
});

/* deduct */
userCredits-=cost;

await updateDoc(doc(db,"users",currentUser.uid),{
credits:userCredits
});

updateCredit();
loadAds();

};

/* ✅ LOAD ADS */
async function loadAds(){

let snap = await getDocs(collection(db,"ads"));

allAds=[];

snap.forEach(d=>{
allAds.push(d.data());
});

render();

}

/* ✅ RENDER */
window.render = ()=>{

let s = search.value.toLowerCase();

products.innerHTML="";

allAds.forEach(ad=>{

if(currentCategory!="All" && ad.category!=currentCategory) return;

if(!ad.title.toLowerCase().includes(s)) return;

products.innerHTML+=`
<div class="product ${ad.featured?'featured':''}">
${ad.image}
<div>

<h4>${ad.featured?'⭐':''} ${ad.title}</h4>

<p>📂 ${ad.category}</p>

<p>R ${ad.price}</p>

<button onclick="window.open('https://wa.me/${ad.whatsapp}')">
WhatsApp
</button>

<button onclick="shareAd('${ad.title}')">Share</button>

</div>
</div>
`;

});

};

/* ✅ SHARE (+1 CREDIT) */
window.shareAd = async (title)=>{

window.open(`https://wa.me/?text=${encodeURIComponent(title)}`);

userCredits +=1;

await updateDoc(doc(db,"users",currentUser.uid),{
credits:userCredits
});

updateCredit();
alert("+1 credit!");
};

</script>

</body>
</html>
