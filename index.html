<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mzansi Market</title>

  <!-- ✅ Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      margin: 0;
      padding-bottom: 40px;
    }
    header {
      background: #1e5aa8;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
      font-weight: bold;
    }
   .form-box {
      background: #eee;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 10px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1e5aa8;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #aaa; }
    #ads {
      max-width: 500px;
      margin: auto;
    }
   .card {
      background: white;
      padding: 15px;
      margin: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
   .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }
   .card a {
      display: inline-block;
      margin-top: 10px;
      background: #25D366;
      color: white;
      padding: 10px 14px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
    #progress { display: none; color: #1e5aa8; margin-top: 5px; }
  </style>
</head>

<body>

<header>🛒 Mzansi Market</header>

<div class="form-box">
  <select id="category">
    <option value="">Select Category</option>
    <option>Dairy</option>
    <option>Fresh Produce</option>
    <option>Bakery</option>
    <option>Meat</option>
    <option>Groceries</option>
    <option>Electronics</option>
    <option>Furniture</option>
    <option>Clothes</option>
    <option>Other</option>
  </select>

  <input id="title" placeholder="Product name - e.g. iPhone 11">
  <input id="price" placeholder="Price - e.g. 4500" type="number">
  <input id="phone" placeholder="WhatsApp number - 2782XXXXXXX no + or 0">

  <input type="file" id="image" accept="image/*">
  <div id="progress">Uploading image...</div>

  <button id="postBtn" onclick="postAd()">Post Ad</button>
</div>

<div id="ads">Loading...</div>

<script>
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const storage = firebase.storage();

  async function postAd() {
    const category = document.getElementById("category").value;
    const title = document.getElementById("title").value.trim();
    const price = document.getElementById("price").value.trim();
    let phone = document.getElementById("phone").value.trim();
    const file = document.getElementById("image").files[0];
    const btn = document.getElementById("postBtn");
    const progress = document.getElementById("progress");

    if (!category ||!title ||!price ||!phone) {
      alert("Fill all fields + select category");
      return;
    }

    phone = phone.replace(/\+|\s|0/g, '');
    if (!phone.startsWith('27') || phone.length!== 11) {
      alert("Phone must be 11 digits starting with 27. Example: 27825551234");
      return;
    }

    btn.disabled = true;
    let imageUrl = "";

    // 1. Upload image to Firebase Storage if selected
    if (file) {
      progress.style.display = "block";
      const fileName = Date.now() + "_" + file.name;
      const storageRef = storage.ref('ads/' + fileName);

      try {
        const snapshot = await storageRef.put(file);
        imageUrl = await snapshot.ref.getDownloadURL();
        progress.style.display = "none";
      } catch(e) {
        alert("Image upload failed: " + e.message);
        btn.disabled = false;
        return;
      }
    }

    // 2. Save ad to Firestore
    try {
      await db.collection("ads").add({
        category: category,
        title: title,
        price: price,
        phone: phone,
        imageUrl: imageUrl,
        createdAt: new Date()
      });

      alert("Ad posted!");
      document.getElementById("category").value = "";
      document.getElementById("title").value = "";
      document.getElementById("price").value = "";
      document.getElementById("phone").value = "";
      document.getElementById("image").value = "";
      btn.disabled = false;
      loadAds();
    } catch(e) {
      alert("Error: " + e.message);
      btn.disabled = false;
    }
  }

  function loadAds() {
    const adsDiv = document.getElementById("ads");
    adsDiv.innerHTML = "Loading...";

    db.collection("ads").orderBy("createdAt", "desc").get()
   .then(snapshot => {
      adsDiv.innerHTML = "";

      if (snapshot.empty) {
        adsDiv.innerHTML = "<p style='text-align:center'>No ads yet. Be the first to post!</p>";
        return;
      }

      snapshot.forEach(doc => {
        const ad = doc.data();
        const imgTag = ad.imageUrl? `<img src="${ad.imageUrl}" alt="${ad.title}">` : "";

        adsDiv.innerHTML += `
          <div class="card">
            ${imgTag}
            <p style="color:#1e5aa8;font-size:12px;margin:0">${ad.category}</p>
            <h3 style="margin:5px 0">${ad.title}</h3>
            <p><b>R${ad.price}</b></p>
            <a href="https://wa.me/${ad.phone}" target="_blank">📲 WhatsApp Seller</a>
          </div>
        `;
      });
    });
  }

  loadAds();
</script>

</body>
</html>
