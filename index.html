<!DOCTYPE html>
<html>
<head>
  <title>Mzansi Marketplace</title>

  <!-- ✅ GOOGLE ADSENSE -->
  <script async 
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5097459177144739"
    crossorigin="anonymous"></script>

</head>

<body style="font-family: Arial; padding:20px;">

<h1>Mzansi Marketplace</h1>

<!-- 🔐 LOGIN -->
<div id="loginDiv">
  <h3>Enter Password</h3>
  <input type="password" id="password">
  <button onclick="login()">Login</button>
</div>

<!-- 📝 POST AD -->
<div id="postDiv" style="display:none;">
  <h2>Post Ad</h2>

  <input id="title" placeholder="Title"><br><br>
  <input id="price" placeholder="Price"><br><br>
  <input id="whatsapp" placeholder="WhatsApp Number (e.g. 27812345678)"><br><br>

  <select id="category">
    <option value="">Select Category</option>
    <option>Plumbing</option>
    <option>Cleaning</option>
    <option>Electrician</option>
    <option>Hair & Beauty</option>
    <option>Transport</option>
    <option>Repairs</option>
    <option>Personal</option>
    <option>Other</option>
  </select><br><br>

  <textarea id="description" placeholder="Description"></textarea><br><br>

  <!-- 💰 PAID AD -->
  <label>
    <input type="checkbox" id="paid"> Make Featured Ad
  </label><br><br>

  <button onclick="saveAd()">Post Ad</button>
  <button onclick="logout()">Logout</button>
</div>

<hr>

<!-- 🔍 FILTER -->
<select id="filter" onchange="loadAds()">
  <option value="">All Categories</option>
  <option>Plumbing</option>
  <option>Cleaning</option>
  <option>Electrician</option>
  <option>Hair & Beauty</option>
  <option>Transport</option>
  <option>Repairs</option>
  <option>Personal</option>
</select>

<hr>

<!-- 📢 ADS -->
<div id="ads"></div>

<!-- ✅ FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgJZL1w5KWMTiDqrRziBM64wA8donunIs",
  authDomain: "mzansimarket-ac296.firebaseapp.com",
  projectId: "mzansimarket-ac296",
  storageBucket: "mzansimarket-ac296.firebasestorage.app",
  messagingSenderId: "613890587901",
  appId: "1:613890587901:web:8b7e278cc00a3610d11294"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔐 LOGIN
function login() {
  if (document.getElementById("password").value === "1234") {
    document.getElementById("loginDiv").style.display = "none";
    document.getElementById("postDiv").style.display = "block";
  } else {
    alert("Wrong password");
  }
}

function logout() {
  document.getElementById("loginDiv").style.display = "block";
  document.getElementById("postDiv").style.display = "none";
}

window.login = login;
window.logout = logout;

// ✅ SAVE AD
async function saveAd() {
  const title = document.getElementById("title").value;
  const price = document.getElementById("price").value;
  const whatsapp = document.getElementById("whatsapp").value;
  const description = document.getElementById("description").value;
  const category = document.getElementById("category").value;
  const paid = document.getElementById("paid").checked;

  if (!title || !price || !whatsapp || !description || !category) {
    alert("Fill all fields");
    return;
  }

  await addDoc(collection(db, "ads"), {
    title, price, whatsapp, description, category, paid,
    createdAt: new Date()
  });

  alert("✅ Ad Posted!");

  // clear form
  document.getElementById("title").value = "";
  document.getElementById("price").value = "";
  document.getElementById("whatsapp").value = "";
  document.getElementById("description").value = "";
  document.getElementById("category").value = "";
  document.getElementById("paid").checked = false;

  loadAds();
}

window.saveAd = saveAd;

// ✅ LOAD ADS
async function loadAds() {
  const adsDiv = document.getElementById("ads");
  const filter = document.getElementById("filter").value;

  adsDiv.innerHTML = "";

  const querySnapshot = await getDocs(collection(db, "ads"));

  let adsArray = [];

  querySnapshot.forEach((doc) => {
    adsArray.push(doc.data());
  });

  // ✅ sort (featured first)
  adsArray.sort((a,b) => b.paid - a.paid);

  adsArray.forEach(ad => {

    if (filter && ad.category !== filter) return;

    adsDiv.innerHTML += `
      <div style="
        border:2px solid ${ad.paid ? 'gold' : 'black'};
        background:${ad.paid ? '#fff8dc' : 'white'};
        padding:15px;
        margin:10px;
      ">
        <h3>${ad.paid ? '⭐ FEATURED ' : ''}${ad.title}</h3>
        <p><b>${ad.category}</b></p>
        <p>${ad.price}</p>
        <p>${ad.description}</p>

        <a href="https://wa.me/${ad.whatsapp}" target="_t on WhatsApp
        </a>

        ${!ad.paid ? `
        <br><br>
        <a href="https://wa.me/27700000000?text=I want to upgrade my ad to
          💰 Upgrade to Featured
        </a>` : ""}
      </div>

      <!-- ✅ GOOGLE AD -->
      <ins class="adsbygoogle"
           style="display:block; margin:10px 0;"
           data-ad-client="ca-pub-5097459177144739"
           data-ad-slot="1234567890"
           data-ad-format="auto"></ins>
    `;
  });

  // load ads
  (adsbygoogle = window.adsbygoogle || []).push({});
}

window.onload = loadAds;

</script>

</body>
</html>
``
