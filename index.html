<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #0066ff;
  color: white;
  text-align: center;
  padding: 20px;
}

nav {
  background: #333;
  display: flex;
  justify-content: center;
  gap: 20px;
  color: white;
  padding: 10px;
  flex-wrap: wrap;
}

.account-box {
  background: #ddd;
  padding: 10px 20px;
  margin: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
  align-items: center;
  border-radius: 8px;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 5px;
  font-family: inherit;
}

.form-box,.post {
  background: white;
  max-width: 500px;
  margin: 15px auto;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  transition: outline 0.3s;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  font-weight: 600;
  margin: 5px 5px 0 0;
  transition: opacity 0.2s;
}

button:hover { opacity: 0.9; }

.auth { background: #0066ff; }
.logout { background: red; }
.edit { background: orange; }
.delete { background: red; }
.sold { background: green; }
.share { background: #25D366; }
.copy { background: #6c757d; }

.sold-label { color: red; font-weight: bold; }
.empty { text-align: center; padding: 20px; color: #666; }
</style>
</head>

<body>

<header>
<h1>Mzansi Market Place 🇿🇦</h1>
<p>Advertise Your Services Across South Africa</p>
</header>

<nav>
<div>Home</div>
<div>Services</div>
<div>Contact</div>
</nav>

<div class="account-box">
<div id="authArea">
<button class="auth" onclick="registerUser()">Register</button>
<button class="auth" onclick="loginUser()">Login</button>
</div>

<div id="userArea" style="display:none;">
<span id="currentUser"></span>
<button class="logout" onclick="logoutUser()">Logout</button>
</div>
</div>

<div class="form-box">
<h2>Post a Service</h2>
<input id="title" placeholder="Service Title">
<input id="phone" placeholder="Phone Number">
<textarea id="description" placeholder="Description" rows="3"></textarea>
<button class="auth" onclick="addPost()">Post</button>
</div>

<div id="posts"></div>

<script>

// ✅ REGISTER
function registerUser() {
  let email = prompt("Enter email:");
  let password = prompt("Enter password:");
  if (!email ||!password) return;

  let users = JSON.parse(localStorage.getItem("users")) || {};
  if (users[email]) return alert("User already exists");

  users[email] = password;
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("currentUser", email);
  alert("Registered & logged in ✅");
  updateUI();
}

// ✅ LOGIN
function loginUser() {
  let email = prompt("Enter email:");
  let password = prompt("Enter password:");
  if (!email ||!password) return;

  let users = JSON.parse(localStorage.getItem("users")) || {};
  if (users[email] === password) {
    localStorage.setItem("currentUser", email);
    updateUI();
  } else {
    alert("Wrong login ❌");
  }
}

// ✅ LOGOUT
function logoutUser() {
  localStorage.removeItem("currentUser");
  updateUI();
}

// ✅ UI UPDATE
function updateUI() {
  let user = localStorage.getItem("currentUser");
  if (user) {
    document.getElementById("authArea").style.display = "none";
    document.getElementById("userArea").style.display = "block";
    document.getElementById("currentUser").innerText = user;
  } else {
    document.getElementById("authArea").style.display = "block";
    document.getElementById("userArea").style.display = "none";
  }
}

// ✅ ADD POST
function addPost() {
  let title = document.getElementById("title").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let description = document.getElementById("description").value.trim();
  if (!title ||!phone ||!description) return alert("Fill all fields");

  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  posts.unshift({
    id: Date.now(),
    title, phone, description,
    sold: false,
    owner: localStorage.getItem("currentUser")
  });

  localStorage.setItem("posts", JSON.stringify(posts));
  document.getElementById("title").value = '';
  document.getElementById("phone").value = '';
  document.getElementById("description").value = '';
  displayPosts();
}

// ✅ DISPLAY POSTS
function displayPosts() {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let container = document.getElementById("posts");

  if (posts.length === 0) {
    container.innerHTML = "<p class='empty'>No posts yet</p>";
    return;
  }

  container.innerHTML = posts.map(post => `
    <div class="post" id="post-${post.id}">
      <h3>${escapeHtml(post.title)}</h3>
      <p>${escapeHtml(post.description)}</p>
      <p><strong>📞 ${escapeHtml(post.phone)}</strong></p>
      ${post.sold? "<p class='sold-label'>SOLD ✅</p>" : ""}

      <button class="edit" onclick="editPost(${post.id})">Edit</button>
      <button class="delete" onclick="deletePost(${post.id})">Delete</button>
      <button class="sold" onclick="markSold(${post.id})">Sold</button>
      <button class="share" onclick="sharePost(${post.id})">Share</button>
      <button class="copy" onclick="copyLink(${post.id})">Copy Link</button>
    </div>
  `).join("");
}

// ✅ DELETE
function deletePost(id) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  if (confirm("Delete post?")) {
    posts = posts.filter(p => p.id!== id);
    localStorage.setItem("posts", JSON.stringify(posts));
    displayPosts();
  }
}

// ✅ EDIT
function editPost(id) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let post = posts.find(p => p.id === id);
  if (!post) return;

  let title = prompt("Edit title:", post.title);
  let description = prompt("Edit description:", post.description);
  let phone = prompt("Edit phone:", post.phone);
  if (title && description && phone) {
    post.title = title.trim();
    post.description = description.trim();
    post.phone = phone.trim();
    localStorage.setItem("posts", JSON.stringify(posts));
    displayPosts();
  }
}

// ✅ SOLD
function markSold(id) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let post = posts.find(p => p.id === id);
  if (post) {
    post.sold = true;
    localStorage.setItem("posts", JSON.stringify(posts));
    displayPosts();
  }
}

// ✅ SHARE WITH DIRECT LINK
function sharePost(id) {
  let post = JSON.parse(localStorage.getItem("posts")) || [];
  post = post.find(p => p.id === id);
  if (!post) return;

  let shareUrl = `${window.location.origin}${window.location.pathname}?post=${id}`;
  let msg = `📢 ${post.title}\n${post.description}\n📞 ${post.phone}\n\n${shareUrl}`;

  if (navigator.share) {
    navigator.share({ text: msg });
  } else {
    window.open("https://wa.me/?text=" + encodeURIComponent(msg));
  }
}

// ✅ COPY LINK
function copyLink(id) {
  let url = `${window.location.origin}${window.location.pathname}?post=${id}`;
  navigator.clipboard.writeText(url)
   .then(() => alert("Link copied!"))
   .catch(() => prompt("Copy this link:", url));
}

// ✅ XSS PROTECTION
function escapeHtml(text) {
  let div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ✅ HANDLE DIRECT LINK & INIT
document.addEventListener("DOMContentLoaded", () => {
  updateUI();
  displayPosts();

  const params = new URLSearchParams(window.location.search);
  const postId = params.get("post");
  if (postId) {
    const el = document.getElementById(`post-${postId}`);
    if (el) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.style.outline = "3px solid #0066ff";
        setTimeout(() => el.style.outline = "", 2500);
      }, 200);
    }
  }
});

</script>
</body>
</html>
