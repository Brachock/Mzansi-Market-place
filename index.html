<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

header {
  background: #0d6efd;
  color: white;
  text-align: center;
  padding: 30px;
}

nav {
  background: #333;
  text-align: center;
  padding: 12px;
}

nav a {
  color: white;
  margin: 10px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  max-width: 800px;
  margin: 20px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  box-sizing: border-box;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0b5ed7;
}

.auth-box {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.auth-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.auth-tabs button {
  flex: 1;
  background: #e9ecef;
  color: #333;
}

.auth-tabs button.active {
  background: #0d6efd;
  color: white;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.user-bar {
  background: #d4edda;
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 20px;
}

.whatsapp {
  background: #25D366;
  color: white;
  padding: 10px 15px;
  margin-top: 10px;
  border-radius: 6px;
  display: inline-block;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>Mzansi Market Place</h1>
  <p>Advertise Your Services Across South Africa</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<div class="container">

<div id="userBar" class="user-bar" style="display:none;">
  Logged in as: <span id="userEmail"></span>
  <button onclick="logout()" style="width:auto; float:right; padding:5px 10px;">Logout</button>
</div>

<div id="authBox" class="auth-box">
  <div class="auth-tabs">
    <button id="loginTab" class="active" onclick="showTab('login')">Login</button>
    <button id="registerTab" onclick="showTab('register')">Register</button>
  </div>

  <div id="login" class="tab-content active">
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <div id="register" class="tab-content">
    <input id="regEmail" type="email" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button onclick="register()">Register</button>
  </div>
</div>

<div id="postSection" style="display:none;">
  <h2>Post a Service</h2>
  <input id="title" placeholder="Service Title">
  <input id="phone" placeholder="Phone Number e.g. 0831234567">
  <textarea id="desc" placeholder="Description" rows="4"></textarea>
  <button onclick="postService()">Post</button>
</div>

<h2>Available Services</h2>
<div id="services">Loading...</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBgJZL1w5KWMTiDqrRziBM64wA8donunIs",
  authDomain: "mzansimarket-ac296.firebaseapp.com",
  projectId: "mzansimarket-ac296",
  storageBucket: "mzansimarket-ac296.appspot.com",
  messagingSenderId: "613890587901",
  appId: "1:613890587901:web:8b7e278cc00a3610d11294"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Tab switching
function showTab(tab) {
  document.getElementById('login').classList.remove('active');
  document.getElementById('register').classList.remove('active');
  document.getElementById('loginTab').classList.remove('active');
  document.getElementById('registerTab').classList.remove('active');
  
  document.getElementById(tab).classList.add('active');
  document.getElementById(tab + 'Tab').classList.add('active');
}

// Auth state
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('authBox').style.display = 'none';
    document.getElementById('postSection').style.display = 'block';
    document.getElementById('userBar').style.display = 'block';
    document.getElementById('userEmail').textContent = user.email;
  } else {
    document.getElementById('authBox').style.display = 'block';
    document.getElementById('postSection').style.display = 'none';
    document.getElementById('userBar').style.display = 'none';
  }
});

// REGISTER
function register() {
  let email = document.getElementById('regEmail').value;
  let password = document.getElementById('regPassword').value;
  
  if (!email || !password) return alert('Fill both fields');
  
  auth.createUserWithEmailAndPassword(email, password)
    .then(() => alert('Account created ✅'))
    .catch(error => alert('Register Error: ' + error.message));
}

// LOGIN
function login() {
  let email = document.getElementById('loginEmail').value;
  let password = document.getElementById('loginPassword').value;
  
  if (!email || !password) return alert('Fill both fields');
  
  auth.signInWithEmailAndPassword(email, password)
    .then(() => alert('Logged in ✅'))
    .catch(error => alert('Login Error: ' + error.message));
}

// LOGOUT
function logout() {
  auth.signOut();
}

// POST SERVICE
function postService() {
  let user = auth.currentUser;
  if (!user) return alert('Please login first');

  let title = document.getElementById('title').value.trim();
  let phone = document.getElementById('phone').value.trim();
  let desc = document.getElementById('desc').value.trim();

  if (!title || !phone || !desc) return alert('Fill all fields');

  db.collection('services').add({
    title, phone, desc,
    user: user.email,
    userId: user.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    alert('Service posted ✅');
    document.getElementById('title').value = '';
    document.getElementById('phone').value = '';
    document.getElementById('desc').value = '';
  }).catch(err => alert(err.message));
}

// LOAD SERVICES
function loadServices() {
  db.collection('services')
    .orderBy('createdAt', 'desc')
    .onSnapshot(snapshot => {
      let html = '';

      if (snapshot.empty) {
        document.getElementById('services').innerHTML = '<p>No services yet.</p>';
        return;
      }

      snapshot.forEach(doc => {
        let s = doc.data();
        let cleanPhone = s.phone.replace(/\D/g, '').replace(/^0/, '27');

        html += `
          <div class="card">
            <h3>${s.title}</h3>
            <p>${s.desc}</p>
            <p><strong>Phone:</strong> ${s.phone}</p>
            <p><strong>Posted by:</strong> ${s.user}</p>
            <a href="https://wa.me/${cleanPhone}" target="_blank" class="whatsapp">Message on WhatsApp</a>
          </div>
        `;
      });

      document.getElementById('services').innerHTML = html;
    }, err => {
      console.error(err);
      document.getElementById('services').innerHTML = '<p>Error loading services.</p>';
    });
}

loadServices();
</script>

</body>
</html>
