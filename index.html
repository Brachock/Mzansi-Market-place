<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
  padding: 0;
}

header {
  background: #0066ff;
  color: white;
  text-align: center;
  padding: 20px;
}

.post,.form-box {
  background: white;
  padding: 15px;
  margin: 15px auto;
  max-width: 500px;
  border-radius: 10px;
  transition: outline 0.3s;
}

input, textarea {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
  box-sizing: border-box;
}

button {
  margin: 5px;
  padding: 8px 12px;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

.edit { background: orange; }
.delete { background: red; }
.sold { background: green; }
.share { background: #25D366; }
.copy { background: #6c757d; }

</style>
</head>

<body>

<header>
  <h1>Mzansi Market Place 🇿🇦</h1>
  <p>Advertise Your Services Across South Africa</p>
</header>

<div class="form-box">
  <h2>Post a Service</h2>
  <input id="title" placeholder="Service Title">
  <input id="phone" placeholder="Phone Number">
  <textarea id="description" placeholder="Description"></textarea>
  <button onclick="addPost()">Post</button>
</div>

<div id="posts"></div>

<script>

// ✅ ADD POST
function addPost() {
  let title = document.getElementById("title").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let description = document.getElementById("description").value.trim();

  if (!title ||!phone ||!description) {
    alert("Fill all fields");
    return;
  }

  let posts = JSON.parse(localStorage.getItem("posts")) || [];

  posts.unshift({ title, phone, description, sold: false });

  localStorage.setItem("posts", JSON.stringify(posts));

  document.getElementById("title").value = '';
  document.getElementById("phone").value = '';
  document.getElementById("description").value = '';

  displayPosts();
}

// ✅ DISPLAY POSTS
function displayPosts() {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let container = document.getElementById("posts");

  if (posts.length === 0) {
    container.innerHTML = "<p style='text-align:center;'>No posts yet</p>";
    return;
  }

  container.innerHTML = posts.map((post, index) => `
    <div class="post" id="post-${index}">
      <h3>${post.title}</h3>
      <p>${post.description}</p>
      <p><strong>📞 ${post.phone}</strong></p>

      ${post.sold? "<p style='color:red;font-weight:bold;'>SOLD ✅</p>" : ""}

      <button class="edit" onclick="editPost(${index})">Edit</button>
      <button class="delete" onclick="deletePost(${index})">Delete</button>
      <button class="sold" onclick="markSold(${index})">Mark Sold</button>
      <button class="share" onclick="sharePost(${index})">Share</button>
      <button class="copy" onclick="copyLink(${index})">Copy Link</button>
    </div>
  `).join("");
}

// ✅ DELETE
function deletePost(index) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  if (confirm("Delete this post?")) {
    posts.splice(index, 1);
    localStorage.setItem("posts", JSON.stringify(posts));
    displayPosts();
  }
}

// ✅ EDIT
function editPost(index) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let post = posts[index];

  let title = prompt("Edit title:", post.title);
  let description = prompt("Edit description:", post.description);
  let phone = prompt("Edit phone:", post.phone);

  if (title && description && phone) {
    posts[index] = {...post, title, description, phone };
    localStorage.setItem("posts", JSON.stringify(posts));
    displayPosts();
  }
}

// ✅ MARK SOLD
function markSold(index) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  posts[index].sold = true;
  localStorage.setItem("posts", JSON.stringify(posts));
  displayPosts();
}

// ✅ SHARE WITH DIRECT LINK
function sharePost(index) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let post = posts[index];
  if (!post) return alert("Post not found");

  let shareUrl = `${window.location.origin}${window.location.pathname}?post=${index}`;

  let message = `🔥 Check this out on Mzansi Market Place 🇿🇦

📌 ${post.title}
📖 ${post.description}

📞 ${post.phone}

View post 👇
${shareUrl}`;

  if (navigator.share) {
    navigator.share({ title: post.title, text: message, url: shareUrl })
   .catch(() => {});
  } else if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    let url = "https://wa.me/?text=" + encodeURIComponent(message);
    window.open(url, "_blank");
  } else {
    navigator.clipboard.writeText(message)
   .then(() => alert("Post copied ✅"))
   .catch(() => prompt("Copy this text:", message));
  }
}

// ✅ COPY LINK ONLY
function copyLink(index) {
  let shareUrl = `${window.location.origin}${window.location.pathname}?post=${index}`;
  navigator.clipboard.writeText(shareUrl)
 .then(() => alert("Link copied!"))
 .catch(() => prompt("Copy this link:", shareUrl));
}

// ✅ HANDLE DIRECT LINK?post=2
document.addEventListener("DOMContentLoaded", () => {
  displayPosts();

  const params = new URLSearchParams(window.location.search);
  const postIndex = params.get("post");

  if (postIndex!== null) {
    const el = document.getElementById(`post-${postIndex}`);
    if (el) {
      setTimeout(() => {
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.style.outline = "3px solid #0066ff";
        setTimeout(() => el.style.outline = "", 2500);
      }, 100);
    }
  }
});

</script>

</body>
</html>
