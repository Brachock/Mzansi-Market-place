<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mzansi Marketplace</title>

<style>
body {font-family:Arial;margin:0;background:#f5f5f5}
header {
  background:#007bff;color:white;padding:15px;
  display:flex;justify-content:space-between;align-items:center;
}
.container {padding:15px;max-width:900px;margin:auto}

.card {background:white;padding:15px;margin-bottom:15px;border-radius:10px}

input,select {
  width:100%;padding:10px;margin:6px 0;
  border-radius:6px;border:1px solid #ddd
}

button {
  background:#007bff;color:white;
  border:none;padding:10px;border-radius:6px
}

.product {
  display:flex;gap:10px;padding:10px;border-bottom:1px solid #ddd
}
.product img {width:80px;height:80px;border-radius:6px}
.featured {border:2px solid gold}

.categories {
 display:flex;gap:5px;overflow-x:auto;margin:10px 0
}
.categories button {padding:6px 10px;background:white;border:1px solid #ddd}
.categories .active {background:#007bff;color:white}

.credit-box {
  padding:10px;background:white;margin-bottom:10px;border-radius:10px
}
.bar {height:6px;background:#eee;border-radius:5px;margin-top:5px}
.bar-fill {height:6px;background:#007bff;border-radius:5px}

.hidden {display:none}
</style>
</head>

<body>

<header>
  <b>Mzansi Market</b>
  <button onclick="showLogin()">Login</button>
</header>

<div class="container">

<!-- LOGIN -->
<div id="auth" class="card hidden">
  <input id="email" placeholder="Email">
  <input id="password" type="password">
  <button onclick="login()">Login</button>
  <button onclick="register()">Register</button>
</div>

<!-- CREDIT -->
<div id="creditBox" class="credit-box hidden"></div>

<!-- SEARCH -->
<div class="card">
<input id="search" placeholder="Search..." oninput="render()">

<div class="categories" id="catBox"></div>
</div>

<!-- POST -->
<div id="postSection" class="card hidden">
<h3>Post Ad</h3>

<input id="title" placeholder="Title">
<input id="price" placeholder="Price">
<input id="whatsapp" placeholder="071...">

<select id="category"></select>

<input type="file" id="img">

<label><input type="checkbox" id="featured"> Featured (3 credits)</label>

<button onclick="postAd()">Post</button>
</div>

<!-- PRODUCTS -->
<div class="card">
<div id="products"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,doc,setDoc,getDoc,updateDoc,
collection,addDoc,getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,ref,uploadBytes,getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* 🔑 YOUR CONFIG */
const firebaseConfig = {
apiKey:"YOUR_KEY",
authDomain:"YOUR_DOMAIN",
projectId:"YOUR_ID",
storageBucket:"YOUR_BUCKET"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);

let currentUser = null;
let userCredits = 0;
let allAds = [];
let currentCategory = "All";

const CATEGORIES = ["Vehicles","Property","Jobs","Electronics","Services"];

/* ✅ LOGIN PANEL */
window.showLogin = () => {
  auth.classList.toggle("hidden");
};

/* ✅ REGISTER */
window.register = async ()=>{
const u = await createUserWithEmailAndPassword(auth,email.value,password.value);

await setDoc(doc(db,"users",u.user.uid),{
credits:10
});

alert("✅ You got 10 credits!");
};

/* ✅ LOGIN */
window.login = async ()=>{
await signInWithEmailAndPassword(auth,email.value,password.value);
};

/* ✅ AUTH STATE */
onAuthStateChanged(auth, async user=>{
currentUser = user;

/* Logged in */
if(user){

postSection.classList.remove("hidden");
creditBox.classList.remove("hidden");
auth.classList.add("hidden");

const snap = await getDoc(doc(db,"users",user.uid));
userCredits = snap.data().credits;

updateCredits();

}else{
postSection.classList.add("hidden");
creditBox.classList.add("hidden");
}

/* ✅ ALWAYS LOAD FOR VISITORS */
loadCategories();
loadAds();

});

/* ✅ CREDIT UI */
function updateCredits(){
creditBox.innerHTML = `
Credits: ${userCredits}
<div class="bar">
<div class="bar-fill" style="width:${(userCredits/10)*100}%"></div>
</div>
`;
}

/* ✅ CATEGORIES */
function loadCategories(){

catBox.innerHTML = `<button class="active" onclick="setCat('All',this)">All</button>`;

category.innerHTML="";

CATEGORIES.forEach(cat=>{
catBox.innerHTML += `<button onclick="setCat('${cat}',this)">${cat}</button>`;
category.innerHTML += `<option>${cat}</option>`;
});

}

window.setCat = (cat,btn)=>{
currentCategory = cat;

document.querySelectorAll(".categories button").forEach(b=>{
b.classList.remove("active");
});
btn.classList.add("active");

render();
};

/* ✅ POST */
window.postAd = async ()=>{

if(!currentUser){
alert("⚠️ Login to post");
return;
}

let cost = featured.checked ? 3 : 1;

if(userCredits < cost){
alert("❌ No credits");
return;
}

/* Upload image */
let imgUrl="https://via.placeholder.com/100";

if(img.files[0]){
const r = ref(storage,"ads/"+Date.now());
const s = await uploadBytes(r,img.files[0]);
imgUrl = await getDownloadURL(s.ref);
}

/* Save ad */
await addDoc(collection(db,"ads"),{
title:title.value,
price:price.value,
category:category.value,
whatsapp:whatsapp.value,
image:imgUrl,
featured:featured.checked,
uid:currentUser.uid
});

/* Deduct credits */
userCredits -= cost;

await updateDoc(doc(db,"users",currentUser.uid),{
credits:userCredits
});

updateCredits();
loadAds();

};

/* ✅ LOAD ADS */
async function loadAds(){

const snap = await getDocs(collection(db,"ads"));
allAds=[];

snap.forEach(d=>{
allAds.push(d.data());
});

render();

}

/* ✅ RENDER */
window.render = ()=>{

let s = search.value.toLowerCase();
products.innerHTML="";

allAds.forEach(ad=>{

if(currentCategory!="All" && ad.category!==currentCategory) return;
if(!ad.title.toLowerCase().includes(s)) return;

products.innerHTML += `
<div class="product ${ad.featured?'featured':''}">
<img srcge}
<div>

<h4>${ad.featured?'⭐':''} ${ad.title}</h4>

<p>📂 ${ad.category}</p>
<p>R ${ad.price}</p>

<button onclick="window.open('https://wa.me/${ad.whatsapp}')">WhatsApp</button>
<button onclick="shareAd('${ad.title}')">Share</button>

</div>
</div>
`;

});

};

/* ✅ SHARE (+1 CREDIT) */
window.shareAd = async (title)=>{

window.open(`https://wa.me/?text=${encodeURIComponent(title)}`);

if(!currentUser) return;

userCredits += 1;

await updateDoc(doc(db,"users",currentUser.uid),{
credits:userCredits
});

updateCredits();

};

</script>

</body>
</html>
