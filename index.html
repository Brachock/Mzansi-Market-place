<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>

<style>
body { font-family: Arial; margin: 0; background: #f4f4f4; }

header {
  background: #0077cc;
  color: white;
  padding: 20px;
  text-align: center;
}

nav {
  background: #333;
  padding: 10px;
  text-align: center;
}

nav button {
  margin: 5px;
  padding: 10px;
}

.container { padding: 20px; }

.card {
  background: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

input, textarea {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
}

button {
  background: green;
  color: white;
  border: none;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h1>Mzansi Market Place</h1>
</header>

<nav>
  <button onclick="showSection('home')">Home</button>
  <button onclick="showSection('register')">Register</button>
  <button onclick="showSection('login')">Login</button>
  <button onclick="showSection('post')">Post Service</button>
</nav>

<div class="container">

<!-- HOME -->
<div id="home">
  <h2>Services</h2>
  <div id="services"></div>
</div>

<!-- REGISTER -->
<div id="register" style="display:none;">
  <h2>Create Account</h2>
  <input id="regUser" placeholder="Username">
  <input id="regPass" placeholder="Password" type="password">
  <button onclick="register()">Register</button>
</div>

<!-- LOGIN -->
<div id="login" style="display:none;">
  <h2>Login</h2>
  <input id="loginUser" placeholder="Username">
  <input id="loginPass" placeholder="Password" type="password">
  <button onclick="login()">Login</button>
</div>

<!-- POST SERVICE -->
<div id="post" style="display:none;">
  <h2>Post Your Service</h2>
  <input id="title" placeholder="Service Title">
  <textarea id="description" placeholder="Description"></textarea>
  <button onclick="postService()">Post</button>
</div>

</div>

<script>

let currentUser = localStorage.getItem("user");

function showSection(id) {
  document.getElementById("home").style.display = "none";
  document.getElementById("register").style.display = "none";
  document.getElementById("login").style.display = "none";
  document.getElementById("post").style.display = "none";

  document.getElementById(id).style.display = "block";
}

// REGISTER
function register() {
  let user = document.getElementById("regUser").value;
  let pass = document.getElementById("regPass").value;

  localStorage.setItem(user, pass);
  alert("Account created!");
}

// LOGIN
function login() {
  let user = document.getElementById("loginUser").value;
  let pass = document.getElementById("loginPass").value;

  if (localStorage.getItem(user) === pass) {
    localStorage.setItem("user", user);
    currentUser = user;
    alert("Logged in!");
  } else {
    alert("Wrong login!");
  }
}

// POST SERVICE
function postService() {
  if (!currentUser) {
    alert("Login first!");
    return;
  }

  let title = document.getElementById("title").value;
  let desc = document.getElementById("description").value;

  let services = JSON.parse(localStorage.getItem("services")) || [];

  services.push({
    user: currentUser,
    title: title,
    desc: desc
  });

  localStorage.setItem("services", JSON.stringify(services));
  loadServices();
}

// DISPLAY SERVICES
function loadServices() {
  let services = JSON.parse(localStorage.getItem("services")) || [];
  let html = "";

  services.forEach(s => {
    html += `
      <div class="card">
        <h3>${s.title}</h3>
        <p>${s.desc}</p>
        <small>Posted by: ${s.user}</small>
      </div>
    `;
  });

  document.getElementById("services").innerHTML = html;
}

loadServices();

</script>

</body>
</html>
