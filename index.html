<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
  header { background:#2e7d32; color:white; padding:15px; text-align:center; }
.container { display:flex; max-width:1200px; margin:20px auto; gap:20px; padding:0 10px; }
.sidebar { width:220px; background:white; padding:15px; border-radius:8px; height:fit-content; }
.main { flex:1; }
.card { background:white; padding:15px; margin-bottom:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
  button { padding:8px 12px; border:none; border-radius:5px; cursor:pointer; background:#2e7d32; color:white; }
  button:hover { background:#256428; }
.btn-danger { background:#d32f2f; }
.btn-secondary { background:#666; }
.btn-whatsapp { background:#25d366; }
  input, select, textarea { width:100%; padding:8px; margin:5px 0 10px; border:1px solid #ccc; border-radius:5px; box-sizing:border-box; }
.auth-bar { text-align:right; padding:10px 20px; background:white; }
.sponsored { font-size:12px; color:#ff9800; font-weight:bold; }
  @media(max-width:768px){.container{flex-direction:column;}.sidebar{width:auto;} }
</style>

<!-- Google Analytics - Replace G-XXXXXXXXXX -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>
</head>
<body>

<header>
  <h2>Mzansi Market</h2>
</header>

<div class="auth-bar" id="authBar"></div>

<div class="container">
  <div class="sidebar">
    <h4>Categories</h4>
    <div id="categories"></div>

    <h4 style="margin-top:20px;">Post Something</h4>
    <input id="title" placeholder="Title">
    <textarea id="desc" placeholder="Description"></textarea>
    <input id="price" type="number" placeholder="Price R">
    <input id="phone" placeholder="WhatsApp number 27XXXXXXXXX">
    <select id="category">
      <option>Cars</option>
      <option>Phones</option>
      <option>Fashion</option>
      <option>Jobs</option>
      <option>Other</option>
    </select>
    <button onclick="addPost()">Post</button>
  </div>

  <div class="main">
    <div id="posts"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "mzansiPosts";
const USER_KEY = "mzansiUser";
let currentFilter = "All";

let posts = [];
try {
  posts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
} catch(e) {
  console.error("Storage read error", e);
  posts = [];
}

const categories = ["All", "Cars", "Phones", "Fashion", "Jobs", "Other"];

function savePosts() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  } catch(e) {
    alert("Storage full. Delete some posts.");
    console.error("Storage write error", e);
  }
}

function getCurrentUser() {
  return localStorage.getItem(USER_KEY) || "Guest";
}

function renderAuthBar() {
  const user = getCurrentUser();
  const bar = document.getElementById("authBar");

  if (user === "Guest") {
    bar.innerHTML = `
      <input id="loginName" placeholder="Enter name" style="width:150px;display:inline-block;">
      <button onclick="login()">Login</button>
    `;
  } else {
    bar.innerHTML = `Logged in as <b>${user}</b> <button class="btn-secondary" onclick="logout()">Logout</button>`;
  }
}

function login() {
  const name = document.getElementById("loginName").value.trim();
  if (!name) return alert("Enter a name");
  localStorage.setItem(USER_KEY, name);
  renderAuthBar();
  displayPosts();
}

function logout() {
  localStorage.removeItem(USER_KEY);
  renderAuthBar();
  displayPosts();
}

function addPost() {
  const user = getCurrentUser();
  if (user === "Guest") return alert("Login first to post");

  const post = {
    id: Date.now(),
    title: document.getElementById("title").value.trim(),
    desc: document.getElementById("desc").value.trim(),
    price: document.getElementById("price").value,
    phone: document.getElementById("phone").value.trim(),
    category: document.getElementById("category").value,
    user: user,
    sold: false,
    sponsored: false,
    created: new Date().toISOString()
  };

  if (!post.title) return alert("Title required");
  if (!post.phone) return alert("Add WhatsApp number");

  posts.unshift(post);
  savePosts();

  gtag('event', 'post_created', { 'category': post.category });

  document.getElementById("title").value = "";
  document.getElementById("desc").value = "";
  document.getElementById("price").value = "";
  document.getElementById("phone").value = "";
  displayPosts();
}

function displayPosts(filter = currentFilter) {
  currentFilter = filter;
  const postsContainer = document.getElementById("posts");
  const currentUser = getCurrentUser();

  let filtered = filter === "All"? posts : posts.filter(p => p.category === filter);

  if (filtered.length === 0) {
    postsContainer.innerHTML = `<div class="card">No posts yet in ${filter}</div>`;
    return;
  }

  let html = "";
  filtered.forEach((p, index) => {
    const globalIndex = posts.indexOf(p);

    if (p.sponsored) {
      gtag('event', 'ad_impression', { 'ad_id': p.id, 'ad_name': p.title });
    }

    html += `
      <div class="card">
        ${p.sponsored? '<span class="sponsored">Sponsored</span>' : ''}
        <h3>${p.title}</h3>
        <p>${p.desc}</p>
        ${p.price? `<p style="font-weight:bold;color:#2e7d32;">R${p.price}</p>` : ''}
        <p style="font-size:12px;color:#666;">By ${p.user} • ${p.category}</p>

        <div style="margin-top:10px;display:flex;gap:5px;flex-wrap:wrap;">
          <button class="btn-whatsapp" onclick="contactSeller(${globalIndex})">WhatsApp</button>
          ${p.user === currentUser? `
            <button onclick="markSold(${globalIndex})">${p.sold? '✅ Sold' : 'Mark Sold'}</button>
            <button class="btn-danger" onclick="deletePost(${globalIndex})">Delete</button>
          ` : ''}
        </div>
      </div>
    `;
  });

  postsContainer.innerHTML = html;
}

function contactSeller(index) {
  const p = posts[index];
  if (!p.phone) return alert("No number provided");

  gtag('event', 'contact_click', { 'post_title': p.title, 'category': p.category });

  // Open WhatsApp. Remove + if user added it
  const phone = p.phone.replace(/\D/g, '');
  const msg = encodeURIComponent(`Hi, I'm interested in your post: ${p.title}`);
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}

function markSold(index) {
  posts[index].sold =!posts[index].sold;
  savePosts();
  displayPosts();
}

function deletePost(index) {
  if (!confirm("Delete this post?")) return;
  posts.splice(index, 1);
  savePosts();
  displayPosts();
}

function renderCategories() {
  const div = document.getElementById("categories");
  div.innerHTML = categories.map(c =>
    `<div><button style="width:100%;margin:3px 0;background:#eee;color:#333;" onclick="displayPosts('${c}')">${c}</button></div>`
  ).join('');
}

// Init
renderAuthBar();
renderCategories();
displayPosts();
</script>
</body>
</html>
