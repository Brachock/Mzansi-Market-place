<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Marketplace</title>

<style>
:root{
--bg:#f5f5f5;
--card:#fff;
--text:#111;
--primary:#0a7cff;
--border:#ddd;
}

.dark{
--bg:#121212;
--card:#1e1e1e;
--text:#fff;
--border:#333;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
}

header{
background:var(--primary);
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

.card{
background:var(--card);
padding:15px;
border-radius:10px;
margin-bottom:15px;
border:1px solid var(--border);
}

input,textarea,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:5px;
border:1px solid #ccc;
}

button{
padding:10px 15px;
border:none;
border-radius:5px;
cursor:pointer;
background:var(--primary);
color:white;
}

.product{
padding:12px;
border-bottom:1px solid var(--border);
}

.price{
font-weight:bold;
color:green;
}

.hidden{
display:none;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.6);
}

.modal-content{
background:white;
padding:20px;
max-width:400px;
margin:100px auto;
border-radius:10px;
}

.search{
margin-bottom:15px;
}
</style>
</head>
<body>

<header>
<div><strong>Mzansi Marketplace</strong></div>
<div id="userInfo">
<button onclick="showLogin()">Login</button>
<button onclick="showRegister()">Register</button>
</div>
</header>

<div class="container">

<div class="card">
<h3>Search Listings</h3>
<input id="searchInput" class="search" placeholder="Search..." onkeyup="renderProducts()">
</div>

<div class="card">
<h3>Post Product</h3>
<p>Anyone can browse ads. Login is only required when posting.</p>

<input id="title" placeholder="Product title">
<input id="price" placeholder="Price">
<textarea id="description" placeholder="Description"></textarea>
<input id="imageFile" type="file" accept="image/*">

<button onclick="addProduct()">Publish Product</button>
</div>

<div class="card">
<h3>Marketplace Listings</h3>
<div id="products"></div>
</div>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
<div class="modal-content">
<h3>Login</h3>
<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="closeLogin()">Close</button>
</div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
<div class="modal-content">
<h3>Register</h3>
<input id="regEmail" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<button onclick="closeRegister()">Close</button>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT.firebaseapp.com",
  projectId:"YOUR_PROJECT_ID",
  storageBucket:"YOUR_PROJECT.appspot.com",
  messagingSenderId:"YOUR_SENDER_ID",
  appId:"YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let allProducts = [];

/* ---------- AUTH ---------- */
window.register = async function(){
  try{
    await createUserWithEmailAndPassword(auth, regEmail.value, regPassword.value);
    closeRegister();
  }catch(err){ alert(err.message); }
};

window.login = async function(){
  try{
    await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
    closeLogin();
  }catch(err){ alert(err.message); }
};

window.logout = async function(){ await signOut(auth); };

onAuthStateChanged(auth,(user)=>{
  currentUser = user || null;
  if(user){
    userInfo.innerHTML = `${user.email} <button onclick="logout()">Logout</button>`;
  }else{
    userInfo.innerHTML = `<button onclick="showLogin()">Login</button> <button onclick="showRegister()">Register</button>`;
  }
});

/* ---------- MODALS ---------- */
window.showLogin = () => loginModal.style.display = "block";
window.closeLogin = () => loginModal.style.display = "none";
window.showRegister = () => registerModal.style.display = "block";
window.closeRegister = () => registerModal.style.display = "none";

/* ---------- PRODUCTS ---------- */
window.addProduct = async function(){
  if(!currentUser){ showLogin(); return; }

  const title = document.getElementById("title").value;
  const price = document.getElementById("price").value;
  const description = document.getElementById("description").value;
  const file = document.getElementById("imageFile").files[0];

  if(!title || !price){ alert("Enter title and price"); return; }

  let imageUrl = "";
  if(file){
    const storageRef = ref(storage, "products/" + Date.now() + "_" + file.name);
    await uploadBytes(storageRef, file);
    imageUrl = await getDownloadURL(storageRef);
  }

  try{
    await addDoc(collection(db,"products"), {
      title, price, description,
      seller: currentUser.email,
      imageUrl,
      createdAt: Date.now()
    });

    document.getElementById("title").value = "";
    document.getElementById("price").value = "";
    document.getElementById("description").value = "";
    document.getElementById("imageFile").value = "";

  }catch(err){ alert(err.message); }
};

const q = query(collection(db,"products"), orderBy("createdAt","desc"));
onSnapshot(q,(snapshot)=>{
  allProducts = [];
  snapshot.forEach(doc=>{ allProducts.push(doc.data()); });
  renderProducts();
});

window.renderProducts = function(){
  const search = searchInput.value.toLowerCase();
  products.innerHTML = "";
  allProducts.forEach(p=>{
    if(!p.title.toLowerCase().includes(search)) return;
    products.innerHTML += `
      <div class="product">
        <h4>${p.title}</h4>
        <div class="price">R${p.price}</div>
        ${p.imageUrl ? `<img src="${p.imageUrl}" style="max-width:200px; border-radius:8px;">` : ""}
        <p>${p.description || ""}</p>
        <small>Seller: ${p.seller}</small>
      </div>
    `;
  });
};

/* ---------- DARK MODE ---------- */
const darkBtn = document.createElement("button");
darkBtn.textContent = "🌙";
darkBtn.onclick = () => { document.body.classList.toggle("dark"); };
document.querySelector("header").appendChild(darkBtn);
</script>

</body>
</html>
