<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 0;
}

header {
  background: #333;
  color: white;
  text-align: center;
  padding: 20px;
}

nav {
  background: #444;
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 10px;
}

nav a {
  color: white;
  text-decoration: none;
}

.container {
  max-width: 800px;
  margin: 20px auto;
  padding: 0 15px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.card img {
  max-width: 100%;
  border-radius: 8px;
  margin: 10px 0;
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  box-sizing: border-box;
}

button {
  background: #333;
  color: white;
  border: none;
  cursor: pointer;
}

button:hover {
  background: #555;
}

.whatsapp {
  background: #25D366;
  color: white;
  border: none;
  padding: 10px 15px;
  margin-top: 10px;
  border-radius: 6px;
  display: inline-block;
  text-decoration: none;
  font-weight: bold;
}

.whatsapp:hover {
  background: #1ebe57;
}

.location-btn {
  background: #007bff;
  width: auto;
  padding: 8px 12px;
  font-size: 14px;
}

.location-text {
  color: #666;
  font-size: 14px;
}

.loading {
  text-align: center;
  padding: 20px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h1>Mzansi Market Place</h1>
  <p>Advertise Your Services Across South Africa</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<div class="container">

<h2>Post a Service</h2>

<input id="title" placeholder="Service Title">
<input id="phone" placeholder="Phone Number e.g. 0831234567">
<textarea id="desc" placeholder="Description" rows="4"></textarea>
<input id="location" placeholder="Location e.g. Johannesburg, Gauteng">

<button class="location-btn" onclick="getLocation()">📍 Use My Location</button>

<input type="file" id="photo" accept="image/*">
<button onclick="postService()">Post</button>

<h2>Available Services</h2>
<div id="services" class="loading">Loading...</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBgJZL1w5KWMTiDqrRziBM64wA8donunIs",
  authDomain: "mzansimarket-ac296.firebaseapp.com",
  projectId: "mzansimarket-ac296",
  storageBucket: "mzansimarket-ac296.appspot.com",
  messagingSenderId: "613890587901",
  appId: "1:613890587901:web:8b7e278cc00a3610d11294"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const storage = firebase.storage();

// Get user location
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      document.getElementById("location").value =
        `Lat: ${pos.coords.latitude.toFixed(4)}, Lng: ${pos.coords.longitude.toFixed(4)}`;
    }, err => {
      alert("Could not get location. Please type it manually.");
    });
  } else {
    alert("Geolocation not supported by your browser.");
  }
}

// POST
async function postService() {
  let title = document.getElementById("title").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let desc = document.getElementById("desc").value.trim();
  let location = document.getElementById("location").value.trim();
  let file = document.getElementById("photo").files[0];

  if (!title ||!phone ||!desc) {
    alert("Fill title, phone and description");
    return;
  }

  let photoURL = "";

  // Upload photo if selected
  if (file) {
    let storageRef = storage.ref(`services/${Date.now()}_${file.name}`);
    let snapshot = await storageRef.put(file);
    photoURL = await snapshot.ref.getDownloadURL();
  }

  db.collection("services").add({
    title: title,
    phone: phone,
    desc: desc,
    location: location,
    photoURL: photoURL,
    createdAt: new Date()
  }).then(() => {
    alert("Service posted!");
    document.getElementById("title").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("location").value = "";
    document.getElementById("photo").value = "";
  }).catch(err => {
    alert("Error: " + err.message);
  });
}

// LOAD
function loadServices() {
  db.collection("services")
   .orderBy("createdAt", "desc")
   .onSnapshot(snapshot => {
      let html = "";

      if (snapshot.empty) {
        document.getElementById("services").innerHTML = "<p>No services yet.</p>";
        return;
      }

      snapshot.forEach(doc => {
        let s = doc.data();
        let cleanPhone = s.phone.replace(/\D/g, '').replace(/^0/, '27');

        html += `
          <div class="card">
            <h3>${s.title}</h3>
            ${s.photoURL? `<img src="${s.photoURL}" alt="Service photo">` : ''}
            <p>${s.desc}</p>
            ${s.location? `<p class="location-text">📍 ${s.location}</p>` : ''}
            <p><strong>Phone:</strong> ${s.phone}</p>
            <a href="https://wa.me/${cleanPhone}" target="_blank" class="whatsapp">Message on WhatsApp</a>
          </div>
        `;
      });

      document.getElementById("services").innerHTML = html;
    }, err => {
      document.getElementById("services").innerHTML = "<p>Error loading services.</p>";
      console.error(err);
    });
}

loadServices();
</script>

</body>
</html>
