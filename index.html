<!DOCTYPE html>
<html>
<head>
  <title>Mzansi Market</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
    }
    header {
      background: green;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 24px;
    }
    .form, .card {
      background: white;
      padding: 15px;
      margin: 15px auto;
      border-radius: 10px;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
    }
    button {
      background: green;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
    }
    a {
      display: inline-block;
      margin-top: 10px;
      background: #25D366;
      color: white;
      padding: 8px 12px;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>Mzansi Market</header>

<div class="form">
  <input id="title" placeholder="Product name">
  <input id="price" placeholder="Price">
  <input id="phone" placeholder="WhatsApp number (27XXXXXXXXX)">
  <button onclick="postAd()">Post Ad</button>
</div>

<div id="ads"></div>

<script>
  // ✅ PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT_ID"
  };

  const app = firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ✅ POST AD (Saves to Firebase)
  function postAd() {
    let title = document.getElementById("title").value;
    let price = document.getElementById("price").value;
    let phone = document.getElementById("phone").value;

    db.collection("ads").add({
      title: title,
      price: price,
      phone: phone,
      createdAt: new Date()
    }).then(() => {
      alert("Ad posted!");
      loadAds();
    });
  }

  // ✅ LOAD ADS (Shows on ALL phones)
  function loadAds() {
    const adsDiv = document.getElementById("ads");
    adsDiv.innerHTML = "";

    db.collection("ads").orderBy("createdAt", "desc").get()
    .then(snapshot => {
      snapshot.forEach(doc => {
        let ad = doc.data();

        adsDiv.innerHTML += `
          <div class="card">
            <h3>${ad.title}</h3>
            <p>R${ad.price}</p>
            <a href="https://wa.me/${ad.phone}" target        `;
      });
    });
  }

  loadAds();
</script>

</body>
</html>
