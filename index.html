<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

header {
  background: #0d6efd;
  color: white;
  text-align: center;
  padding: 30px;
}

nav {
  background: #333;
  text-align: center;
  padding: 12px;
}

nav a {
  color: white;
  margin: 10px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  max-width: 800px;
  margin: 20px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  box-sizing: border-box;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0b5ed7;
}

.whatsapp {
  background: #25D366;
  color: white;
  padding: 10px 15px;
  margin-top: 10px;
  border-radius: 6px;
  display: inline-block;
  text-decoration: none;
  font-weight: bold;
}

.whatsapp:hover {
  background: #1ebe57;
}

.auth-buttons {
  display: flex;
  gap: 10px;
}

.auth-buttons button {
  width: auto;
  padding: 8px 15px;
}
</style>
</head>

<body>

<header>
  <h1>Mzansi Market Place</h1>
  <p>Advertise Your Services Across South Africa</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<div class="container">

<h2>Account</h2>
<div class="auth-buttons">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
  <button onclick="logout()">Logout</button>
</div>
<div id="userStatus"></div>

<h2>Post a Service</h2>

<input id="title" placeholder="Service Title">
<input id="phone" placeholder="Phone Number e.g. 0831234567">
<textarea id="desc" placeholder="Description" rows="4"></textarea>
<button onclick="postService()">Post</button>

<h2>Available Services</h2>
<div id="services">Loading...</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBgJZL1w5KWMTiDqrRziBM64wA8donunIs",
  authDomain: "mzansimarket-ac296.firebaseapp.com",
  projectId: "mzansimarket-ac296",
  storageBucket: "mzansimarket-ac296.appspot.com",
  messagingSenderId: "613890587901",
  appId: "1:613890587901:web:8b7e278cc00a3610d11294"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// Show login status
auth.onAuthStateChanged(user => {
  document.getElementById("userStatus").textContent = user ? `Logged in as: ${user.email}` : "Not logged in";
});

// REGISTER
function register() {
  let email = prompt("Enter email:");
  let password = prompt("Enter password:");
  if (!email || !password) return;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => alert("Account created ✅"))
    .catch(error => alert(error.message));
}

// LOGIN
function login() {
  let email = prompt("Enter email:");
  let password = prompt("Enter password:");
  if (!email || !password) return;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => alert("Logged in ✅"))
    .catch(error => alert(error.message));
}

// LOGOUT
function logout() {
  auth.signOut().then(() => alert("Logged out ✅"));
}

// POST SERVICE
function postService() {
  let user = auth.currentUser;
  if (!user) {
    alert("Please login first ❌");
    return;
  }

  let title = document.getElementById("title").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let desc = document.getElementById("desc").value.trim();

  if (!title || !phone || !desc) {
    alert("Fill all fields");
    return;
  }

  db.collection("services").add({
    title: title,
    phone: phone,
    desc: desc,
    user: user.email,
    userId: user.uid,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    alert("Service posted ✅");
    document.getElementById("title").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("desc").value = "";
  }).catch(err => alert(err.message));
}

// LOAD SERVICES
function loadServices() {
  db.collection("services")
    .orderBy("createdAt", "desc")
    .onSnapshot(snapshot => {
      let html = "";

      if (snapshot.empty) {
        document.getElementById("services").innerHTML = "<p>No services yet.</p>";
        return;
      }

      snapshot.forEach(doc => {
        let s = doc.data();
        // Clean phone for WhatsApp: remove spaces, dashes, replace 0 with 27
        let cleanPhone = s.phone.replace(/\D/g, '').replace(/^0/, '27');

        html += `
          <div class="card">
            <h3>${s.title}</h3>
            <p>${s.desc}</p>
            <p><strong>Phone:</strong> ${s.phone}</p>
            <p><strong>Posted by:</strong> ${s.user}</p>
            <a href="https://wa.me/${cleanPhone}" target="_blank" class="whatsapp">Message on WhatsApp</a>
          </div>
        `;
      });

      document.getElementById("services").innerHTML = html;
    }, err => {
      console.error(err);
      document.getElementById("services").innerHTML = "<p>Error loading services.</p>";
    });
}

loadServices();
</script>

</body>
</html>
