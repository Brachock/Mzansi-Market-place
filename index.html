<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #0066ff;
  color: white;
  text-align: center;
  padding: 20px;
}

nav {
  background: #333;
  display: flex;
  justify-content: center;
  gap: 20px;
  color: white;
  padding: 10px;
}

.account-box {
  background: #ddd;
  padding: 10px;
  margin: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}

.form-box, .post {
  background: white;
  margin: 15px;
  padding: 15px;
  border-radius: 10px;
}

button {
  padding: 10px;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

.auth { background: #0066ff; }
.logout { background: red; }
.edit { background: orange; }
.delete { background: red; }
.sold { background: green; }
.share { background: #25D366; }
</style>
</head>

<body>

<header>
<h1>Mzansi Market Place 🇿🇦</h1>
<p>Advertise Your Services Across South Africa</p>
</header>

<nav>
<div>Home</div>
<div>Services</div>
<div>Contact</div>
</nav>

<div class="account-box">
<div id="authArea">
<button class="auth" onclick="registerUser()">Register</button>
<button class="auth" onclick="loginUser()">Login</button>
</div>

<div id="userArea" style="display:none;">
<span id="currentUser"></span>
<button class="logout" onclick="logoutUser()">Logout</button>
</div>
</div>

<div class="form-box">
<h2>Post a Service</h2>

<input id="title" placeholder="Service Title">
<input id="phone" placeholder="Phone Number">
<textarea id="description" placeholder="Description"></textarea>

<button class="auth" onclick="addPost()">Post</button>
</div>

<div id="posts"></div>

<script>

// ✅ REGISTER
function registerUser() {
  let email = prompt("Enter email:");
  let password = prompt("Enter password:");

  if (!email || !password) return;

  let users = JSON.parse(localStorage.getItem("users")) || [];
  users.push({ email, password });

  localStorage.setItem("users", JSON.stringify(users));
  alert("Registered ✅");
}

// ✅ LOGIN
function loginUser() {
  let email = prompt("Enter email:");
  let password = prompt("Enter password:");

  let users = JSON.parse(localStorage.getItem("users")) || [];
  let user = users.find(u => u.email === email && u.password === password);

  if (user) {
    localStorage.setItem("currentUser", email);
    updateUI();
  } else {
    alert("Wrong login ❌");
  }
}

// ✅ LOGOUT
function logoutUser() {
  localStorage.removeItem("currentUser");
  updateUI();
}

// ✅ UI UPDATE
function updateUI() {
  let user = localStorage.getItem("currentUser");

  if (user) {
    document.getElementById("authArea").style.display = "none";
    document.getElementById("userArea").style.display = "block";
    document.getElementById("currentUser").innerText = user;
  } else {
    document.getElementById("authArea").style.display = "block";
    document.getElementById("userArea").style.display = "none";
  }
}

// ✅ ADD POST
function addPost() {
  let title = document.getElementById("title").value;
  let phone = document.getElementById("phone").value;
  let description = document.getElementById("description").value;

  if (!title || !phone || !description) {
    alert("Fill all fields");
    return;
  }

  let posts = JSON.parse(localStorage.getItem("posts")) || [];

  posts.push({
    title,
    phone,
    description,
    sold: false
  });

  localStorage.setItem("posts", JSON.stringify(posts));
  displayPosts();
}

// ✅ DISPLAY POSTS
function displayPosts() {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let container = document.getElementById("posts");

  container.innerHTML = "";

  if (posts.length === 0) {
    container.innerHTML = "<p style='text-align:center;'>No posts yet</p>";
  }

  posts.forEach((post, index) => {
    container.innerHTML += `
      <div class="post">
        <h3>${post.title}</h3>
        <p>${post.description}</p>
        <p><strong>${post.phone}</strong></p>

        ${post.sold ? "<p style='color:red;'>SOLD ✅</p>" : ""}

        <button class="edit" onclick="editPost(${index})">Edit</button>
        <button class="delete" onclick="deletePost(${index})">Delete</button>
        <button class="sold" onclick="markSold(${index})">Sold</button>
        <button class="share" onclick="sharePost(${index})">Share</button>
      </div>
    `;
  });
}

// ✅ DELETE
function deletePost(index) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];

  if (confirm("Delete post?")) {
    posts.splice(index, 1);
    localStorage.setItem("posts", JSON.stringify(posts));
    displayPosts();
  }
}

// ✅ EDIT
function editPost(index) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let post = posts[index];

  let title = prompt("Edit title:", post.title);
  let description = prompt("Edit description:", post.description);
  let phone = prompt("Edit phone:", post.phone);

  if (title && description && phone) {
    posts[index] = { ...post, title, description, phone };
    localStorage.setItem("posts", JSON.stringify(posts));
    displayPosts();
  }
}

// ✅ SOLD
function markSold(index) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  posts[index].sold = true;
  localStorage.setItem("posts", JSON.stringify(posts));
  displayPosts();
}

// ✅ SHARE
function sharePost(index) {
  let posts = JSON.parse(localStorage.getItem("posts")) || [];
  let post = posts[index];

  let msg = `📢 ${post.title}
${post.description}
📞 ${post.phone}
${window.location.href}`;

  if (navigator.share) {
    navigator.share({ text: msg });
  } else {
    window.open("https://wa.me/?text=" + encodeURIComponent(msg));
  }
}

updateUI();
displayPosts();

</script>
</body>
</html>
