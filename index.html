<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>
<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  h1 {
    color: #ff6b00;
    margin: 0;
  }
  .post {
    background: #fff;
    padding: 15px;
    margin: 15px auto;
    max-width: 600px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: outline 0.3s;
  }
  .post h3 {
    margin: 0 0 10px;
    color: #333;
  }
  .post p {
    margin: 0 0 8px;
    color: #555;
  }
  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  button {
    background: #ff6b00;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
  }
  button.secondary {
    background: #6c757d;
  }
  button:hover {
    opacity: 0.9;
  }
  .add-post {
    max-width: 600px;
    margin: 0 auto 30px;
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  input, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-sizing: border-box;
    font-family: inherit;
  }
</style>
</head>

<header
