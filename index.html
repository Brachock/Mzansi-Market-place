<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mzansi Marketplace</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { max-width: 600px; margin: 0 auto; padding: 15px; background: #f5f5f5; }
    h1 { color: #ff6b00; text-align: center; }
    .card { background: white; padding: 15px; border-radius: 10px; margin: 10px 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
    button { background: #ff6b00; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #e55f00; }
    button.danger { background: #d32f2f; }
    .ad-card { border-left: 4px solid #ff6b00; }
    .ad-price { color: #2e7d32; font-size: 20px; font-weight: bold; }
    .ad-date { color: #666; font-size: 12px; }
    .logout { background: #555; }
    #postDiv { display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>

<h1>🇿🇦 Mzansi Marketplace</h1>

<!-- 🔐 LOGIN -->
<div id="loginDiv" class="card">
  <h3>Login to Post Ads</h3>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>
  <p style="font-size: 12px; color: #666;">Create account free. No "1234" passwords here 😂</p>
</div>

<!-- 📝 POST AD -->
<div id="postDiv" class="card">
  <h3>Post an Ad</h3>
  <input id="title" placeholder="Service/Product Title" required>
  <input id="price" type="number" placeholder="Price R" required>
  <input id="contact" placeholder="WhatsApp Number" required>
  <textarea id="desc" rows="3" placeholder="Describe your service/product" required></textarea>
  <button onclick="saveAd()">Post Ad</button>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<hr>

<!-- 📢 ADS -->
<h2>Available Ads</h2>
<div id="ads">Loading...</div>

<!-- 🔥 FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ✅ REPLACE WITH YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBgJZL1w5KWMTiDqrRziBM64wA8donunIs",
  authDomain: "mzansimarket-ac296.firebaseapp.com",
  projectId: "mzansimarket-ac296",
  storageBucket: "mzansimarket-ac296.firebasestorage.app",
  messagingSenderId: "613890587901",
  appId: "1:613890587901:web:8b7e278cc00a3610d11294"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginDiv = document.getElementById("loginDiv");
const postDiv = document.getElementById("postDiv");

// 🔐 Check login state
onAuthStateChanged(auth, (user) => {
  if (user) {
    loginDiv.classList.add("hidden");
    postDiv.style.display = "block";
  } else {
    loginDiv.classList.remove("hidden");
    postDiv.style.display = "none";
  }
  loadAds();
});

// Login
window.login = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (error) {
    alert("Login failed: " + error.message);
  }
}

// Signup
window.signup = async function() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if (password.length < 6) {
    alert("Password must be 6+ characters");
    return;
  }
  try {
    await createUserWithEmailAndPassword(auth, email, password);
    alert("Account created! You can now post ads.");
  } catch (error) {
    alert("Signup failed: " + error.message);
  }
}

// Logout
window.logout = async function() {
  await signOut(auth);
}

// Save Ad
window.saveAd = async function() {
  const title = document.getElementById("title").value.trim();
  const price = document.getElementById("price").value.trim();
  const contact = document.getElementById("contact").value.trim();
  const desc = document.getElementById("desc").value.trim();

  if (!title || !price || !contact || !desc) {
    alert("Fill all fields bro");
    return;
  }

  try {
    await addDoc(collection(db, "ads"), {
      title,
      price: Number(price),
      contact,
      desc,
      userId: auth.currentUser.uid,
      userEmail: auth.currentUser.email,
      createdAt: new Date()
    });

    alert("✅ Ad posted!");
    document.getElementById("title").value = "";
    document.getElementById("price").value = "";
    document.getElementById("contact").value = "";
    document.getElementById("desc").value = "";
    loadAds();

  } catch (error) {
    alert("Error: " + error.message);
  }
}

// Load Ads
window.loadAds = async function() {
  const adsContainer = document.getElementById("ads");
  adsContainer.innerHTML = "Loading...";

  try {
    const q = query(collection(db, "ads"), orderBy("createdAt", "desc"));
    const querySnapshot = await getDocs(q);

    if (querySnapshot.empty) {
      adsContainer.innerHTML = "<p>No ads yet. Be the first to post!</p>";
      return;
    }

    adsContainer.innerHTML = "";
    querySnapshot.forEach((docSnap) => {
      const ad = docSnap.data();
      const isOwner = auth.currentUser && ad.userId === auth.currentUser.uid;
      const date = ad.createdAt.toDate().toLocaleDateString('en-ZA');
      
      adsContainer.innerHTML += `
        <div class="card ad-card">
          <h3>${ad.title}</h3>
          <p class="ad-price">R${ad.price}</p>
          <p>${ad.desc}</p>
          <p>📱 WhatsApp: <a href="https://wa.me/${ad.contact.replace(/\D/g,'')}" target="_blank">${ad.contact}</a></p>
          <p class="ad-date">Posted: ${date}</p>
          ${isOwner ? `<button class="danger" onclick="deleteAd('${docSnap.id}')">Delete</button>` : ''}
        </div>
      `;
    });
  } catch (error) {
    adsContainer.innerHTML = "<p>Error loading ads. Check console.</p>";
    console.error(error);
  }
}

// Delete Ad
window.deleteAd = async function(id) {
  if (confirm("Delete this ad?")) {
    await deleteDoc(doc(db, "ads", id));
    loadAds();
  }
}
</script>

</body>
</html>
