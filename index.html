<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

header {
  background: #0d6efd;
  color: white;
  text-align: center;
  padding: 30px;
}

nav {
  background: #333;
  text-align: center;
  padding: 12px;
}

nav a {
  color: white;
  margin: 10px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  max-width: 800px;
  margin: 20px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1);
}

.card img {
  max-width: 100%;
  border-radius: 8px;
  margin: 10px 0;
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  box-sizing: border-box;
}

button {
  background: #0d6efd;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0b5ed7;
}

.whatsapp {
  background: #25D366;
  color: white;
  border: none;
  padding: 10px 15px;
  margin-top: 10px;
  border-radius: 6px;
  display: inline-block;
  text-decoration: none;
  font-weight: bold;
}

.whatsapp:hover {
  background: #1ebe57;
}

.hidden {
  display: none;
}

.user-bar {
  background: #e9ecef;
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 20px;
  text-align: right;
}

.location-text {
  color: #666;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <h1>Mzansi Market Place</h1>
  <p>Advertise Your Services Across South Africa</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Services</a>
  <a href="#">Contact</a>
</nav>

<div class="container">

<div id="userBar" class="user-bar hidden">
  <span id="userEmail"></span>
  <button onclick="logout()" style="width:auto; padding:5px 10px; margin-left:10px;">Logout</button>
</div>

<div id="authSection">
  <h2>Account</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>
</div>

<div id="postSection" class="hidden">
  <h2>Post a Service</h2>
  <input id="title" placeholder="Service Title">
  <input id="phone" placeholder="Phone Number e.g. 0831234567">
  <textarea id="desc" placeholder="Description" rows="4"></textarea>
  <input id="location" placeholder="Location e.g. Johannesburg, Gauteng">
  <input type="file" id="photo" accept="image/*">
  <button onclick="postService()">Post</button>
</div>

<h2>Available Services</h2>
<div id="services">Loading...</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBgJZL1w5KWMTiDqrRziBM64wA8donunIs",
  authDomain: "mzansimarket-ac296.firebaseapp.com",
  projectId: "mzansimarket-ac296",
  storageBucket: "mzansimarket-ac296.appspot.com",
  messagingSenderId: "613890587901",
  appId: "1:613890587901:web:8b7e278cc00a3610d11294"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// Auth state listener
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("authSection").classList.add("hidden");
    document.getElementById("postSection").classList.remove("hidden");
    document.getElementById("userBar").classList.remove("hidden");
    document.getElementById("userEmail").textContent = user.email;
  } else {
    document.getElementById("authSection").classList.remove("hidden");
    document.getElementById("postSection").classList.add("hidden");
    document.getElementById("userBar").classList.add("hidden");
  }
});

// Register
function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  auth.createUserWithEmailAndPassword(email, password)
   .catch(err => alert(err.message));
}

// Login
function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  auth.signInWithEmailAndPassword(email, password)
   .catch(err => alert(err.message));
}

// Logout
function logout() {
  auth.signOut();
}

// Post Service
async function postService() {
  const user = auth.currentUser;
  if (!user) return alert("Login first");

  let title = document.getElementById("title").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let desc = document.getElementById("desc").value.trim();
  let location = document.getElementById("location").value.trim();
  let file = document.getElementById("photo").files[0];

  if (!title ||!phone ||!desc) {
    return alert("Fill title, phone and description");
  }

  let photoURL = "";
  if (file) {
    let storageRef = storage.ref(`services/${Date.now()}_${file.name}`);
    let snapshot = await storageRef.put(file);
    photoURL = await snapshot.ref.getDownloadURL();
  }

  db.collection("services").add({
    title, phone, desc, location, photoURL,
    userId: user.uid,
    userEmail: user.email,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    alert("Service posted!");
    document.getElementById("title").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("location").value = "";
    document.getElementById("photo").value = "";
  }).catch(err => alert(err.message));
}

// Load Services
function loadServices() {
  db.collection("services")
   .orderBy("createdAt", "desc")
   .onSnapshot(snapshot => {
      let html = "";

      if (snapshot.empty) {
        document.getElementById("services").innerHTML = "<p>No services yet.</p>";
        return;
      }

      snapshot.forEach(doc => {
        let s = doc.data();
        let cleanPhone = s.phone.replace(/\D/g, '').replace(/^0/, '27');

        html += `
          <div class="card">
            <h3>${s.title}</h3>
            ${s.photoURL? `<img src="${s.photoURL}" alt="Service photo">` : ''}
            <p>${s.desc}</p>
            ${s.location? `<p class="location-text">📍 ${s.location}</p>` : ''}
            <p><strong>Phone:</strong> ${s.phone}</p>
            <p><small>Posted by: ${s.userEmail}</small></p>
            <a href="https://wa.me/${cleanPhone}" target="_blank" class="whatsapp">Message on WhatsApp</a>
          </div>
        `;
      });

      document.getElementById("services").innerHTML = html;
    });
}

loadServices();
</script>

</body>
</html>
