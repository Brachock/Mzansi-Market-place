<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market 🇿🇦</title>

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  background:#f2f2f2;
  padding-bottom:80px;
}
.navbar {
  background:#1e5aa8;
  color:white;
  padding:15px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  position:sticky;
  top:0;
  z-index:999;
}
.form-box {
  background:#eee;
  padding:15px;
  margin:15px auto;
  border-radius:10px;
  max-width:420px;
}
input, select {
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:5px;
  border:1px solid #ccc;
  box-sizing:border-box;
  font-size:15px;
}
button {
  width:100%;
  padding:12px;
  background:#1e5aa8;
  color:white;
  border:none;
  margin-top:6px;
  border-radius:5px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}
button:disabled { background:#aaa; }
.card {
  background:white;
  padding:15px;
  margin:15px auto;
  border-radius:10px;
  max-width:520px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.card img {
  width:100%;
  height:230px;
  object-fit:cover;
  border-radius:8px;
  margin-bottom:10px;
}
.wa-btn {
  display:inline-block;
  margin-top:8px;
  background:#25D366;
  color:white;
  padding:10px 14px;
  border-radius:5px;
  text-decoration:none;
  font-weight:bold;
}
.edit-btn { background:#ffc107; color:#000; }
.delete-btn { background:#dc3545; }
.review-btn { background:#6c757d; }
#userInfo { text-align:center; padding:10px; font-weight:bold; color:#1e5aa8; }

/* Floating WhatsApp Admin Button */
.whatsapp-float {
  position: fixed;
  width: 170px;
  height: 50px;
  bottom: 20px;
  right: 20px;
  background-color: #25D366;
  color: white;
  border-radius: 25px;
  text-align: center;
  font-size: 15px;
  font-weight: bold;
  box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
.whatsapp-float:hover { background-color: #20ba5a; }
@media screen and (max-width: 600px) {
  .whatsapp-float {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    font-size: 26px;
  }
  .whatsapp-float span { display: none; }
}
</style>
</head>

<body>

<div class="navbar">🇿🇦 Mzansi Market</div>
<div id="userInfo">Not logged in</div>

<!-- LOGIN / SIGNUP -->
<div class="form-box">
  <h3>Login / Sign Up</h3>
  <input id="email" placeholder="Email" type="email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="signup()">Sign Up</button>
  <button onclick="logout()">Logout</button>
</div>

<!-- SEARCH + FILTER -->
<div class="form-box">
  <h3>Search Ads</h3>
  <input id="search" placeholder="Search product..." oninput="loadAds()">
  <select id="filterCategory" onchange="loadAds()">
    <option value="">All Categories</option>
    <option>Dairy</option>
    <option>Cars</option>
    <option>Electronics</option>
    <option>Furniture</option>
    <option>Clothes</option>
    <option>Personal</option>
    <option>Other</option>
  </select>
