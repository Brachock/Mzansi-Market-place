<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mzansi Marketplace</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f2f2f2;
margin:0;
}

header{
background:#0a7cff;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 6px rgba(0,0,0,.1);
}

input,textarea{
width:100%;
padding:10px;
margin:5px 0;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

button{
background:#0a7cff;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.product{
border-bottom:1px solid #eee;
padding:10px 0;
}

.hidden{
display:none;
}

.price{
color:green;
font-weight:bold;
}
</style>
</head>
<body>

<header>
<h2>Mzansi Marketplace</h2>
<div id="userInfo"></div>
</header>

<div class="container">

<div id="authSection" class="card">

<h3>Login</h3>

<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="login()">
Login
</button>

<hr>

<h3>Register</h3>

<input id="regEmail" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">

<button onclick="register()">
Register
</button>

</div>

<div id="appSection" class="hidden">

<div class="card">

<h3>Post Product</h3>

<input id="title" placeholder="Product title">

<input id="price" placeholder="Price">

<textarea
id="description"
placeholder="Description"></textarea>

<button onclick="addProduct()">
Publish
</button>

<button onclick="logout()">
Logout
</button>

</div>

<div class="card">

<h3>Marketplace Listings</h3>

<div id="products"></div>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

let currentUser = null;

window.register = async function(){

const email =
document.getElementById("regEmail").value.trim();

const password =
document.getElementById("regPassword").value;

if(!email || !password){
alert("Fill all fields");
return;
}

try{

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert("Registration successful");

}catch(err){

alert(err.message);

}

};

window.login = async function(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(err){

alert(err.message);

}

};

window.logout = async function(){

await signOut(auth);

};

onAuthStateChanged(auth,(user)=>{

if(user){

currentUser = user;

loadApp();

listenProducts();

}else{

currentUser = null;

document
.getElementById("authSection")
.classList.remove("hidden");

document
.getElementById("appSection")
.classList.add("hidden");

document
.getElementById("userInfo")
.innerHTML = "";

}

});

function loadApp(){

document
.getElementById("authSection")
.classList.add("hidden");

document
.getElementById("appSection")
.classList.remove("hidden");

document
.getElementById("userInfo")
.innerHTML = currentUser.email;

}

window.addProduct = async function(){

const title =
document.getElementById("title").value;

const price =
document.getElementById("price").value;

const description =
document.getElementById("description").value;

if(!title || !price){

alert("Enter title and price");

return;

}

try{

await addDoc(
collection(db,"products"),
{
title,
price,
description,
seller: currentUser.email,
createdAt: Date.now()
}
);

document.getElementById("title").value="";
document.getElementById("price").value="";
document.getElementById("description").value="";

}catch(err){

alert(err.message);

}

};

function listenProducts(){

const q = query(
collection(db,"products"),
orderBy("createdAt","desc")
);

onSnapshot(q,(snapshot)=>{

const container =
document.getElementById("products");

container.innerHTML = "";

snapshot.forEach((doc)=>{

const p = doc.data();

container.innerHTML += `
<div class="product">

<h4>${p.title}</h4>

<div class="price">
R${p.price}
</div>

<p>${p.description || ""}
</p>

<small>
Seller: ${p.seller}
</small>

</div>
`;

});

});

}

</script>

</body>
</html>
