<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mzansi Marketplace</title>
<style>
:root{--bg:#f5f7fa;--card:#ffffff;--text:#1a1a1a;--primary:#0a7cff;--border:#e0e0e0;--success:#25D366}
.dark{--bg:#121212;--card:#1e1e1e;--text:#fff;--border:#333}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:80px}
header{background:var(--primary);color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:var(--card);padding:15px;border-radius:12px;margin-bottom:15px;border:1px solid var(--border)}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;min-height:44px}
button{background:var(--primary);color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:600;font-size:16px;min-height:44px}
.btn-whatsapp{background:var(--success)}
.btn-danger{background:#dc3545}
.btn-secondary{background:#6c757d}
.hidden{display:none}
.product{display:flex;gap:12px;padding:12px;border-bottom:1px solid var(--border)}
.product img{width:90px;height:90px;object-fit:cover;border-radius:8px}
.price{color:#28a745;font-weight:700;font-size:18px}
.featured{border:2px solid #ffc107}
.featured-badge{background:#ffc107;color:#000;padding:3px 8px;border-radius:5px;font-size:12px;font-weight:700;margin-right:5px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.categories button{white-space:nowrap;padding:8px 16px;font-size:14px;background:var(--bg);color:var(--text);border:1px solid var(--border)}
.categories button.active{background:var(--primary);color:white}
.loading{text-align:center;padding:30px;color:#888}
.empty{text-align:center;padding:40px;color:#888}
.preview-img{width:100%;height:200px;object-fit:cover;border-radius:8px;margin:8px 0;display:none}
</style>
</head>
<body>

<header>
  <div><strong>Mzansi Marketplace</strong></div>
  <button onclick="toggleDark()">🌙</button>
</header>

<div class="container">
  <div id="authSection" class="card">
    <h3>Login</h3>
    <input id="loginEmail" placeholder="Email" type="email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <hr style="margin:15px 0">
    <h3>Register</h3>
    <input id="regEmail" placeholder="Email" type="email">
    <input id="regPassword" type="password" placeholder="Password min 6 chars">
    <button onclick="register()">Register</button>
  </div>

  <div id="appSection" class="hidden">
    <div class="card">
      <input id="searchInput" placeholder="Search..." oninput="renderProducts()">
      <div class="categories">
        <button class="active" onclick="setCategory('All', this)">All</button>
        <button onclick="setCategory('Vehicles', this)">Vehicles</button>
        <button onclick="setCategory('Property', this)">Property</button>
        <button onclick="setCategory('Jobs', this)">Jobs</button>
        <button onclick="setCategory('Electronics', this)">Electronics</button>
        <button onclick="setCategory('Services', this)">Services</button>
      </div>
    </div>

    <div class="card">
      <h3>Post Listing</h3>
      <input id="title" placeholder="Title">
      <input id="price" placeholder="Price" inputmode="numeric">
      <select id="category">
        <option>Vehicles</option><option>Property</option><option>Jobs</option>
        <option>Electronics</option><option>Services</option>
      </select>
      <input id="location" placeholder="Location">
      <input id="whatsapp" placeholder="WhatsApp 071...">
      <input id="imageFile" type="file" accept="image/*" onchange="previewImage(event)">
      <img id="preview" class="preview-img">
      <textarea id="description" placeholder="Description" rows="3"></textarea>
      <label><input type="checkbox" id="featured"> Featured R20</label>
      <button onclick="addProduct()">Publish</button>
      <button class="btn-secondary" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h3>Listings</h3>
      <div id="products"><div class="loading">Loading...</div></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let allProducts = [];
let currentCategory = 'All';
let selectedFile = null;

window.register = async function(){
  try{ await createUserWithEmailAndPassword(auth, regEmail.value, regPassword.value); alert("Account created!"); }
  catch(err){ alert(err.message); }
};

window.login = async function(){
  try{ await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value); }
  catch(err){ alert(err.message); }
};

window.logout = async function(){ await signOut(auth); };

onAuthStateChanged(auth, function(user){
  currentUser = user;
  if(user){
    authSection.classList.add("hidden");
    appSection.classList.remove("hidden");
    listenProducts();
  }else{
    authSection.classList.remove("hidden");
    appSection.classList.add("hidden");
  }
});

window.previewImage = function(e){
  selectedFile = e.target.files[0];
  if(selectedFile){
    var reader = new FileReader();
    reader.onload = function(e){ preview.src = e.target.result; preview.style.display = 'block'; }
    reader.readAsDataURL(selectedFile);
  }
}

window.toggleDark = function(){ document.body.classList.toggle("dark"); }

window.setCategory = function(cat, btn){
  currentCategory = cat;
  document.querySelectorAll('.categories button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderProducts();
}

window.deleteProduct = async function(id){
  if(confirm("Delete?")) await deleteDoc(doc(db, "products", id));
}

window.addProduct = async function(){
  if(!currentUser){ alert("Login first"); return; }
  var title = title.value.trim();
  var price = price.value.replace(/[^0-9]/g, "");
  var whatsapp = whatsapp.value.replace(/[^0-9]/g, "");
  if(!title ||!price ||!whatsapp){ alert("Fill title, price, WhatsApp"); return; }

  var imageUrl = "https://picsum.photos/400/400?random=" + Date.now();
  if(selectedFile){
    var storageRef = ref(storage, 'listings/' + Date.now());
    var snap = await uploadBytes(storageRef, selectedFile);
    imageUrl = await getDownloadURL(snap.ref);
  }

  await addDoc(collection(db,"products"), {
    title: title, price: Number(price), description: description.value,
    category: category.value, location: location.value, whatsapp: whatsapp,
    imageUrl: imageUrl, featured: featured.checked, uid: currentUser.uid,
    seller: currentUser.email, createdAt: serverTimestamp()
  });

  ['title','price','description','location','whatsapp','imageFile'].forEach(function(id){ document.getElementById(id).value = ''; });
  preview.style.display = 'none'; selectedFile = null; featured.checked = false;
  alert("Posted!");
};

function listenProducts(){
  var q = query(collection(db,"products"), orderBy("createdAt","desc"));
  onSnapshot(q, function(snapshot){
    allProducts = [];
    snapshot.forEach(function(doc){ allProducts.push({id: doc.id, data: doc.data()}); });
    renderProducts();
  });
}

window.renderProducts = function(){
  var search = searchInput.value.toLowerCase();
  products.innerHTML = "";

  var filtered = allProducts.filter(function(p){
    var d = p.data;
    return (d.title.toLowerCase().indexOf(search) > -1 || (d.description || '').toLowerCase().indexOf(search) > -1)
      && (currentCategory === 'All' || d.category === currentCategory);
  });

  filtered.sort(function(a,b){ return (b.data.featured?1:0) - (a.data.featured?1:0); });

  if(filtered.length === 0){
    products.innerHTML = '<div class="empty">No listings yet</div>';
    return;
  }

  for(var i = 0; i < filtered.length; i++){
    var p = filtered[i];
    var d = p.data;

    var waNumber = d.whatsapp? '27' + d.whatsapp.replace(/^0/, '') : '';
    var waLink = waNumber? 'https://wa.me/' + waNumber + '?text=Hi, about ' + encodeURIComponent(d.title) : '#';
    var featuredBadge = d.featured? '<span class="featured-badge">⭐ FEATURED</span>' : '';
    var deleteBtn = currentUser && currentUser.uid === d.uid? '<button class="btn-danger" onclick="deleteProduct(\'' + p.id + '\')">Delete</button>' : '';

    products.innerHTML +=
      '<div class="product ' + (d.featured? 'featured' : '') + '">' +
        '<img src="' + d.imageUrl + '" loading="lazy">' +
        '<div style="flex:1">' +
          '<h4>' + featuredBadge + d.title + '</h4>' +
          '<div class="price">R ' + Number(d.price).toLocaleString() + '</div>' +
          '<p style="font-size:13px;color:#666">' + (d.location || '') + ' • ' + d.category + '</p>' +
          '<p style="font-size:13px">' + (d.description || '') + '</p>' +
          '<div style="margin-top:8px">' +
            '<button class="btn-whatsapp" onclick="window.open(\'' + waLink + '\')">WhatsApp</button> ' +
            deleteBtn +
          '</div>' +
          '<small style="color:#888">By ' + d.seller + '</small>' +
        '</div>' +
      '</div>';
  }
};
</script>
</body>
</html>
