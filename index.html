<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Market Place</title>

<style>
body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; }

header {
  background:#0066ff; color:white; text-align:center; padding:20px;
}

nav {
  background:#333; color:white;
  display:flex; justify-content:center; gap:20px; padding:10px; flex-wrap:wrap;
}

.account-box {
  background:#ddd; padding:10px 20px; margin:10px;
  display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
  border-radius:8px;
}

.form-box,.post {
  background:white; max-width:500px; margin:15px auto; padding:15px;
  border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input, textarea {
  width:100%; padding:10px; margin:5px 0;
  box-sizing:border-box; border:1px solid #ddd; border-radius:5px;
  font-family:inherit;
  font-size:14px;
}

input:focus, textarea:focus {
  outline:2px solid #0066ff;
  border-color:#0066ff;
}

button {
  padding:10px 15px; border:none; border-radius:5px;
  color:white; margin:3px; cursor:pointer; font-weight:600;
  transition:opacity 0.2s;
}

button:hover { opacity:0.9; }
button:disabled { opacity:0.6; cursor:not-allowed; }

.auth { background:#0066ff; }
.logout { background:red; }
.edit { background:orange; }
.delete { background:red; }
.sold { background:green; }
.share { background:#25D366; }

.empty { text-align:center; color:#666; padding:20px; }
small { color:#666; }
.sold-label { color:red; font-weight:bold; }
.loading { text-align:center; padding:20px; color:#666; }
</style>
</head>

<body>

<header>
<h1>Mzansi Market Place 🇿🇦</h1>
<p>Advertise Your Services Across South Africa</p>
</header>

<nav>
<div>Home</div>
<div>Services</div>
<div>Contact</div>
</nav>

<div class="account-box">
<div id="authArea">
<button class="auth" onclick="registerUser()">Register</button>
<button class="auth" onclick="loginUser()">Login</button>
</div>

<div id="userArea" style="display:none;">
<span id="currentUser"></span>
<button class="logout" onclick="logoutUser()">Logout</button>
</div>
</div>

<div class="form-box" id="postForm" style="display:none;">
<h2>Post a Service</h2>
<input id="title" placeholder="Service Title">
<input id="phone" placeholder="Phone Number">
<textarea id="description" placeholder="Description" rows="3"></textarea>
<button class="auth" id="postBtn" onclick="addPost()">Post</button>
</div>

<div id="posts">
  <p class="loading">Loading posts...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { 
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, 
  query, orderBy, onSnapshot 
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
import { 
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
  signOut, onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgJZL1w5KWMTiDqrRziBM64wA8donunIs",
  authDomain: "mzansimarket-ac296.firebaseapp.com",
  projectId: "mzansimarket-ac296",
  storageBucket: "mzansimarket-ac296.firebasestorage.app",
  messagingSenderId: "613890587901",
  appId: "1:613890587901:web:8b7e278cc00a3610d11294"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const postsCol = collection(db, "posts");
let currentUser = null;

// AUTH STATE LISTENER
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  updateUI();
});

// REGISTER
window.registerUser = async () => {
  let email = prompt("Email:");
  let pass = prompt("Password:");
  if(!email ||!pass) return;

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    alert("Registered & logged in ✅");
  } catch(e) {
    alert(e.message);
  }
}

// LOGIN
window.loginUser = async () => {
  let email = prompt("Email:");
  let pass = prompt("Password:");
  if(!email ||!pass) return;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    alert("Wrong details ❌");
  }
}

// LOGOUT
window.logoutUser = async () => {
  await signOut(auth);
}

// UI UPDATE
function updateUI(){
  if(currentUser){
    document.getElementById("authArea").style.display="none";
    document.getElementById("userArea").style.display="block";
    document.getElementById("postForm").style.display="block";
    document.getElementById("currentUser").innerText=currentUser.email;
  } else {
    document.getElementById("authArea").style.display="block";
    document.getElementById("userArea").style.display="none";
    document.getElementById("postForm").style.display="none";
  }
}

// ADD POST
window.addPost = async () => {
  if(!currentUser) return alert("Please login first 🔐");

  let title = document.getElementById("title").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let desc = document.getElementById("description").value.trim();
  if(!title ||!phone ||!desc) return alert("Fill all fields");

  const btn = document.getElementById("postBtn");
  btn.disabled = true;
  btn.textContent = "Posting...";

  try {
    await addDoc(postsCol, {
      title, phone, description: desc,
      sold: false,
      ownerId: currentUser.uid,
      ownerEmail: currentUser.email,
      createdAt: Date.now()
    });

    document.getElementById("title").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("description").value = "";
  } catch(e) {
    alert("Error posting: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Post";
  }
}

// REALTIME DISPLAY POSTS
const q = query(postsCol, orderBy("createdAt", "desc"));
onSnapshot(q, (snapshot) => {
  let container = document.getElementById("posts");
  
  if(snapshot.empty){
    container.innerHTML="<p class='empty'>No posts yet</p>";
    return;
  }

  container.innerHTML = snapshot.docs.map(docSnap => {
    let p = docSnap.data();
    let id = docSnap.id;
    let isOwner = currentUser && currentUser.uid === p.ownerId;

    return `
      <div class="post" id="post-${id}">
        <h3>${escapeHtml(p.title)}</h3>
        <p>${escapeHtml(p.description)}</p>
        <p><strong>📞 ${escapeHtml(p.phone)}</strong></p>
        <small>Posted by: ${escapeHtml(p.ownerEmail)} • ${timeAgo(p.createdAt)}</small>
        ${p.sold? "<p class='sold-label'>SOLD ✅</p>" : ""}

        ${isOwner? `
          <button class="edit" onclick="editPost('${id}')">Edit</button>
          <button class="delete" onclick="deletePost('${id}')">Delete</button>
          <button class="sold" onclick="markSold('${id}')">Sold</button>
        `:""}

        <button class="share" onclick="sharePost('${id}')">Share</button>
      </div>
    `;
  }).join("");
}, (error) => {
  console.error(error);
  document.getElementById("posts").innerHTML = "<p class='empty'>Error loading posts</p>";
});

// EDIT POST
window.editPost = async (id) => {
  if(!currentUser) return alert("Please login first 🔐");
  
  let docRef = doc(db, "posts", id);
  let newTitle = prompt("New title:");
  let newDesc = prompt("New description:");
  let newPhone = prompt("New phone:");
  
  if(newTitle && newDesc && newPhone){
    try {
      await updateDoc(docRef, {
        title: newTitle.trim(),
        description: newDesc.trim(),
        phone: newPhone.trim()
      });
    } catch(e) {
      alert("Error updating: " + e.message);
    }
  }
}

// DELETE POST
window.deletePost = async (id) => {
  if(!currentUser) return alert("Please login first 🔐");
  if(confirm("Delete this post?")){
    try {
      await deleteDoc(doc(db, "posts", id));
    } catch(e) {
      alert("Error deleting: " + e.message);
    }
  }
}

// MARK SOLD
window.markSold = async (id) => {
  if(!currentUser) return alert("Please login first 🔐");
  try {
    await updateDoc(doc(db, "posts", id), { sold: true });
  } catch(e) {
    alert("Error updating: " + e.message);
  }
}

// SHARE
window.sharePost = (id) => {
  let url = `${location.origin}${location.pathname}?post=${id}`;
  let msg = `Check this out on Mzansi Market Place:\n${url}`;
  if(navigator.share){
    navigator.share({text:msg});
  } else {
    window.open("https://wa.me/?text="+encodeURIComponent(msg));
  }
}

// XSS PROTECTION
function escapeHtml(text){
  let div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// TIME AGO
function timeAgo(ts) {
  if(!ts) return "";
  let diff = Date.now() - ts;
  let days = Math.floor(diff / 86400000);
  let hours = Math.floor(diff / 3600000);
  let mins = Math.floor(diff / 60000);
  
  if(days > 0) return `${days}d ago`;
  if(hours > 0) return `${hours}h ago`;
  if(mins > 0) return `${mins}m ago`;
  return "Just now";
}

// AUTO-SCROLL TO POST FROM URL
window.addEventListener("load", () => {
  const params = new URLSearchParams(window.location.search);
  const postId = params.get("post");
  if(postId){
    setTimeout(() => {
      const el = document.getElementById(`post-${postId}`);
      if(el){
        el.scrollIntoView({ behavior:"smooth", block:"center" });
        el.style.outline = "3px solid #0066ff";
        setTimeout(() => el.style.outline = "", 2500);
      }
    }, 500);
  }
});
</script>
</body>
</html>
