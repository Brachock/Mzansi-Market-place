<!DOCTYPE html>
<html>
<head>
  <title>Mzansi Market Place ZA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; margin:0; background:#f5f5f5; }
    header { background:#1565c0; color:white; padding:20px; text-align:center; }
   .nav { background:#333; color:white; padding:10px; text-align:center; }
   .nav a { color:white; margin:10px; text-decoration:none; cursor:pointer; }
   .container { padding:20px; }
   .card { background:white; padding:15px; margin:15px auto; border-radius:10px; width:90%; max-width:600px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    input, select, textarea { width:90%; padding:10px; margin:5px; border:1px solid #ddd; border-radius:5px; }
    button { padding:10px 15px; margin:5px; background:#1565c0; color:white; border:none; border-radius:5px; cursor:pointer; }
    button:hover { background:#0d47a1; }
   .post img { width:100%; border-radius:10px; margin-bottom:10px; }
   .category-btn { padding:8px 12px; margin:5px; background:#ddd; border:none; border-radius:5px; cursor:pointer; }
   .category-btn:hover { background:#bbb; }
   .whatsapp-btn { background:#25D366; color:white; text-decoration:none; padding:10px 15px; display:inline-block; border-radius:5px; margin-top:10px; }
  </style>
</head>

<body>

<header>
  <h1>Mzansi Market Place ZA</h1>
  <p>Advertise Your Services Across South Africa</p>
</header>

<div class="nav">
  <a onclick="showHome()">Home</a>
  <a onclick="showAdd()">Post</a>
</div>

<div class="container">

<!-- FORM -->
<div id="addScreen" style="display:none;" class="card">
  <h3>Post Your Service</h3>
  <p style="color:red;font-size:12px;">⚠️ No illegal or adult services allowed</p>

  <input type="text" id="title" placeholder="Title" required><br>
  <input type="text" id="price" placeholder="Price (optional)"><br>
  <input type="tel" id="phone" placeholder="Phone number e.g. 0821234567" required><br>

  <select id="category">
    <option>Services</option>
    <option>Personal Services</option>
    <option>Jobs</option>
    <option>Rentals</option>
    <option>Transport</option>
    <option>Catering</option>
    <option>Hairdresser</option>
    <option>Car Wash</option>
    <option>Clothing</option>
    <option>Furniture</option>
  </select>

  <input type="file" id="image" accept="image/*"><br>
  <textarea id="desc" placeholder="Description" style="height:80px;"></textarea><br>

  <button onclick="postItem()">Post</button>
  <button onclick="showHome()" style="background:#666;">Cancel</button>
</div>

<!-- HOME -->
<div id="homeScreen">
  <div style="text-align:center;">
    <button class="category-btn" onclick="filter('All')">All</button>
    <button class="category-btn" onclick="filter('Services')">Services</button>
    <button class="category-btn" onclick="filter('Jobs')">Jobs</button>
    <button class="category-btn" onclick="filter('Rentals')">Rentals</button>
    <button class="category-btn" onclick="filter('Transport')">Transport</button>
  </div>
  <div id="posts"></div>
</div>

</div>

<script>
let allPosts = JSON.parse(localStorage.getItem('mzansiPosts')) || [];

function showAdd(){
  addScreen.style.display="block";
  homeScreen.style.display="none";
}

function showHome(){
  addScreen.style.display="none";
  homeScreen.style.display="block";
  displayPosts(allPosts);
}

// Load posts on page load
window.onload = () => displayPosts(allPosts);

function postItem(){
  let title = document.getElementById("title").value.trim();
  let price = document.getElementById("price").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let category = document.getElementById("category").value;
  let desc = document.getElementById("desc").value.trim();
  let file = document.getElementById("image").files[0];

  if(!title ||!phone){
    alert("Please fill title and phone number!");
    return;
  }

  let savePost = (imageData) => {
    let post = {
      id: Date.now(),
      title, price, phone, category, desc,
      image: imageData,
      date: new Date().toLocaleDateString()
    };

    allPosts.unshift(post);
    localStorage.setItem('mzansiPosts', JSON.stringify(allPosts));
    displayPosts(allPosts);
    showHome();

    // Clear form
    document.getElementById("title").value = "";
    document.getElementById("price").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("desc").value = "";
    document.getElementById("image").value = "";
  };

  if(file){
    let reader = new FileReader();
    reader.onload = e => savePost(e.target.result);
    reader.readAsDataURL(file);
  } else {
    savePost("");
  }
}

// FIXED DISPLAY POSTS
function displayPosts(list){
  if(list.length === 0){
    document.getElementById("posts").innerHTML = "<div class='card'><p>No posts yet. Be the first to post!</p></div>";
    return;
  }

  let html = "";
  list.forEach(p => {
    let phoneClean = p.phone.replace(/\s+/g, '').replace(/^0/, '27');

    html += `
      <div class="card post">
        ${p.image? `<img src="${p.image}" alt="${p.title}">` : ''}
        <h3>${p.title}</h3>
        <p>${p.desc}</p>
        <p><b>${p.price? "R" + p.price : "Price on request"}</b></p>
        <p>📂 ${p.category} | 📅 ${p.date}</p>
        <a href="https://wa.me/${phoneClean}" target="_blank" class="whatsapp-btn">💬 WhatsApp</a>
      </div>
    `;
  });

  document.getElementById("posts").innerHTML = html;
}

// FILTER
function filter(cat){
  if(cat === "All"){
    displayPosts(allPosts);
  } else {
    let filtered = allPosts.filter(p => p.category === cat);
    displayPosts(filtered);
  }
}
</script>

</body>
</html>
