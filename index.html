<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mzansi Marketplace</title>

<style>
:root{
--bg:#f5f5f5;
--card:#ffffff;
--text:#111;
--primary:#0d6efd;
--border:#ddd;
}

.dark{
--bg:#121212;
--card:#1e1e1e;
--text:#fff;
--border:#333;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
padding-bottom:80px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:var(--card);
border-bottom:1px solid var(--border);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:22px;
font-weight:bold;
}

.search{
padding:12px;
}

.search input{
width:100%;
padding:12px;
border-radius:25px;
border:1px solid var(--border);
}

.categories{
display:flex;
overflow:auto;
gap:8px;
padding:10px;
}

.categories button{
padding:10px 15px;
border:none;
border-radius:20px;
cursor:pointer;
}

.card{
background:var(--card);
margin:12px;
border-radius:15px;
overflow:hidden;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.content{
padding:12px;
}

.price{
font-size:20px;
font-weight:bold;
margin:5px 0;
}

.actions{
display:flex;
gap:10px;
margin-top:10px;
}

button{
cursor:pointer;
}

.btn{
padding:10px;
border:none;
border-radius:8px;
}

.primary{
background:#000;
color:white;
}

.favorite{
background:red;
color:white;
}

.whatsapp{
background:#25D366;
color:white;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
padding:10px;
background:var(--card);
border-top:1px solid var(--border);
}

.page{
display:none;
}

.active{
display:block;
}

input,textarea,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:1px solid var(--border);
}

.profile-card{
background:var(--card);
margin:15px;
padding:15px;
border-radius:15px;
}

.chat-window{
height:300px;
overflow:auto;
background:var(--card);
padding:10px;
border-radius:10px;
margin-bottom:10px;
}

.message{
padding:8px;
margin:5px;
border-radius:8px;
background:#ddd;
}

.dark .message{
background:#333;
}
</style>
</head>
<body>

<header>
<div class="logo">Mzansi Marketplace</div>
<div>
Credits: <span id="credits">10</span>
<button onclick="toggleDark()">🌙</button>
</div>
</header>

<div class="search">
<input id="searchInput" placeholder="Search listings..." onkeyup="renderListings()">
</div>

<div class="categories">
<button onclick="setCategory('All')">All</button>
<button onclick="setCategory('Vehicles')">Vehicles</button>
<button onclick="setCategory('Property')">Property</button>
<button onclick="setCategory('Jobs')">Jobs</button>
<button onclick="setCategory('Electronics')">Electronics</button>
<button onclick="setCategory('Services')">Services</button>
</div>

<!-- HOME -->
<div id="home" class="page active">
<div id="listingContainer"></div>
</div>

<!-- POST -->
<div id="post" class="page">

<div style="padding:15px">

<h2>Create Listing</h2>

<input id="title" placeholder="Title">

<input id="price" placeholder="Price">

<select id="category">
<option>Vehicles</option>
<option>Property</option>
<option>Jobs</option>
<option>Electronics</option>
<option>Services</option>
</select>

<input id="location" placeholder="Location">

<input id="image" placeholder="Image URL">

<textarea id="description" placeholder="Description"></textarea>

<label>
<input type="checkbox" id="featured">
Featured Listing (3 Credits)
</label>

<button class="btn primary" onclick="addListing()">
Post Listing
</button>

</div>

</div>

<!-- FAVORITES -->
<div id="favorites" class="page">
<h2 style="padding:15px">Favorites</h2>
<div id="favoriteContainer"></div>
</div>

<!-- CHAT -->
<div id="chat" class="page">

<div style="padding:15px">

<h2>Messages</h2>

<div class="chat-window" id="chatWindow"></div>

<input id="chatInput">

<button class="btn primary" onclick="sendMessage()">
Send
</button>

</div>

</div>

<!-- PROFILE -->
<div id="profile" class="page">

<div class="profile-card">

<h2>Seller Profile</h2>

<p>Name: Demo Seller</p>

<p>Rating: ⭐⭐⭐⭐⭐</p>

<p>Listings: <span id="listingCount">0</span></p>

<p>Favorites: <span id="favoriteCount">0</span></p>

<button onclick="inviteFriends()">
Invite Friends
</button>

</div>

</div>

<div class="nav">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('post')">➕</button>
<button onclick="showPage('favorites')">❤️</button>
<button onclick="showPage('chat')">💬</button>
<button onclick="showPage('profile')">👤</button>
</div>

<script>
let listings =
JSON.parse(localStorage.getItem("listings")) || [];

let favorites =
JSON.parse(localStorage.getItem("favorites")) || [];

let categoryFilter="All";

function saveStorage(){
localStorage.setItem(
"listings",
JSON.stringify(listings)
);

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);
}

function toggleDark(){
document.body.classList.toggle("dark");
}

function showPage(id){

document
.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");
}

function setCategory(cat){
categoryFilter=cat;
renderListings();
}

function addListing(){

let cost=
featured.checked ? 3 : 1;

let credits=
parseInt(
creditsEl().innerText
);

if(credits<cost){
alert("Not enough credits");
return;
}

credits-=cost;
creditsEl().innerText=credits;

const listing={
id:Date.now(),
title:title.value,
price:price.value,
category:category.value,
location:location.value,
image:image.value ||
"https://picsum.photos/600/400",
description:description.value,
featured:featured.checked
};

listings.unshift(listing);

saveStorage();

renderListings();

alert("Listing posted");
}

function renderListings(){

const search=
searchInput.value.toLowerCase();

const container=
document.getElementById(
"listingContainer"
);

container.innerHTML="";

let data=[...listings];

data.sort(
(a,b)=>
(b.featured?1:0)-
(a.featured?1:0)
);

data.forEach(item=>{

if(
categoryFilter!=="All" &&
item.category!==categoryFilter
) return;

if(
!item.title.toLowerCase()
.includes(search)
) return;

container.innerHTML+=`
<div class="card">

<img src="${item.image}">

<div class="content">

<h3>
${item.featured ? "⭐" : ""}
${item.title}
</h3>

<div class="price">
R ${item.price}
</div>

<p>${item.location}</p>

<p>${item.description}</p>

<div class="actions">

<button
class="btn favorite"
onclick="toggleFavorite(${item.id})">
❤️
</button>

<button
class="btn primary"
onclick="showPage('chat')">
Chat
</button>

<button
class="btn whatsapp"
onclick="shareListing('${item.title}')">
WhatsApp
</button>

</div>

</div>
</div>
`;
});

updateStats();
}

function toggleFavorite(id){

if(favorites.includes(id))
favorites=
favorites.filter(x=>x!==id);
else
favorites.push(id);

saveStorage();

renderFavorites();
}

function renderFavorites(){

const c=
document.getElementById(
"favoriteContainer"
);

c.innerHTML="";

favorites.forEach(id=>{

const item=
listings.find(
x=>x.id===id
);

if(!item) return;

c.innerHTML+=`
<div class="card">

<img src="${item.image}">

<div class="content">

<h3>${item.title}</h3>

<div class="price">
R ${item.price}
</div>

</div>

</div>
`;
});

updateStats();
}

function shareListing(title){

window.open(
`https://wa.me/?text=${encodeURIComponent(title)}`
);
}

function sendMessage(){

const msg=
chatInput.value;

if(!msg) return;

chatWindow.innerHTML+=`
<div class="message">
${msg}
</div>
`;

chatInput.value="";
}

function inviteFriends(){

alert(
"Referral link copied (prototype)"
);
}

function updateStats(){

listingCount.innerText=
listings.length;

favoriteCount.innerText=
favorites.length;
}

function creditsEl(){
return document.getElementById(
"credits"
);
}

if(listings.length===0){

listings.push(
{
id:1,
title:"Toyota Corolla",
price:"85000",
category:"Vehicles",
location:"Johannesburg",
description:"Excellent condition",
image:"https://picsum.photos/600/400?1",
featured:true
},
{
id:2,
title:"2 Bedroom Flat",
price:"450000",
category:"Property",
location:"Pretoria",
description:"Close to schools",
image:"https://picsum.photos/600/400?2",
featured:false
}
);

saveStorage();
}

renderListings();
renderFavorites();
</script>

</body>
</html>
